# Builds docker/measure.Dockerfile natively for arm64 when the branch measure-image is pushed. The image goes nowhere
# but into an artifact of the run (docker save, gzip, kept 5 days): it reaches a mower only by hand, over ssh.
name: measure image

on:
  push:
    branches: [measure-image]

concurrency:
  group: measure-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Short commit
        id: rev
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/measure.Dockerfile
          build-args: SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          tags: mowbite-measure:${{ steps.rev.outputs.short }}-arm64
          cache-from: type=gha,scope=measure-arm64
          cache-to: type=gha,scope=measure-arm64,mode=max

      - name: Check, measure and save the image
        env:
          TAG: mowbite-measure:${{ steps.rev.outputs.short }}-arm64
        run: |
          docker run --rm "$TAG" ros2 pkg list > pkgs.txt
          grep -qx xcore_driver pkgs.txt
          if grep -qE '^(mowbite_sim|mowbite_logic|mowbite_bridge|mowbite_planner)$' pkgs.txt; then
            echo "only xcore_driver and its dependencies belong in the image"; exit 1
          fi
          docker run --rm "$TAG" ros2 launch xcore_driver measure.launch.py --show-args > /dev/null
          # DDS on the loopback profile of the image; without the file the launch halts and no driver starts.
          docker run --rm "$TAG" bash -c 'test "$ROS_AUTOMATIC_DISCOVERY_RANGE" = SYSTEM_DEFAULT \
            && grep -q 127.0.0.1 "$FASTRTPS_DEFAULT_PROFILES_FILE"'
          cid=$(docker run -d -e FASTRTPS_DEFAULT_PROFILES_FILE=/nonexistent "$TAG" ros2 launch xcore_driver measure.launch.py)
          sleep 8
          out=$(docker logs "$cid" 2>&1); docker stop "$cid" > /dev/null; docker rm "$cid" > /dev/null
          echo "$out" | grep -q 'MOWBITE_OS_HALT reason=DDS_PROFILE' || { echo "$out"; echo "no halt without the profile"; exit 1; }
          if echo "$out" | grep -q 'process started'; then echo "$out"; echo "a driver started without the profile"; exit 1; fi
          docker run --rm "$TAG" python3 /ws/tools/measure.py --help > /dev/null
          docker run --rm "$TAG" python3 /ws/tools/xcore_capture.py --help > /dev/null
          docker save "$TAG" | gzip -6 > "mowbite-measure-${{ steps.rev.outputs.short }}-arm64.tar.gz"
          size=$(docker image inspect --format '{{.Size}}' "$TAG")
          {
            echo "### arm64"
            echo "- image: \`$TAG\`"
            echo "- size unpacked: $((size / 1000000)) MB, saved and gzipped: $(( $(stat -c %s mowbite-measure-*.tar.gz) / 1000000 )) MB"
            echo "- sha256: $(sha256sum mowbite-measure-*.tar.gz | cut -d' ' -f1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: mowbite-measure-${{ steps.rev.outputs.short }}-arm64
          path: mowbite-measure-${{ steps.rev.outputs.short }}-arm64.tar.gz
          retention-days: 5
          compression-level: 0
          if-no-files-found: error
