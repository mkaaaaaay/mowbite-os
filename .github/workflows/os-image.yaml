# Builds docker/os.Dockerfile natively for arm64, for amd64 too when started by hand with push, which alone pushes to
# ghcr.io.
# The arm64 image also goes into an artifact of the run (docker save, layers repacked with gzip, kept 5 days), the way
# to a mower by hand over ssh (docker load < the .tar) without ghcr: gzip layers, because the containerd store of the
# mower keeps the layers as they come and unpacked beside them.
name: os image

on:
  push:
    branches: [os-image]
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to ghcr.io/mkaaaaaay/mowbite-os
        type: boolean
        default: false

concurrency:
  group: os-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/mkaaaaaay/mowbite-os

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ inputs.push && fromJSON('["amd64", "arm64"]') || fromJSON('["arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Planner commit of the Dockerfile
        id: planner
        run: echo "commit=$(sed -n 's/^ARG PLANNER_COMMIT=//p' docker/os.Dockerfile)" >> "$GITHUB_OUTPUT"

      # The planner branch os-pin lives in a private repo; a read-only deploy key opens it.
      - uses: actions/checkout@v7
        with:
          repository: mkaaaaaay/mowbite-planner-tron
          ref: ${{ steps.planner.outputs.commit }}
          ssh-key: ${{ secrets.PLANNER_DEPLOY_KEY }}
          persist-credentials: false
          path: planer

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit
        id: rev
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Oldest app for this OS
        id: min_app
        run: echo "version=$(cat docker/min_app)" >> "$GITHUB_OUTPUT"

      - name: Firmware major version of the xCore driver
        id: xcore
        run: |
          major=$(sed -n 's/^ *expected_major_version: *\([0-9][0-9]*\) *$/\1/p' src/xcore_driver/config/nx60i.yaml)
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/os.Dockerfile
          build-contexts: planer=planer
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            MIN_APP=${{ steps.min_app.outputs.version }}
            XCORE_FIRMWARE_MAJOR=${{ steps.xcore.outputs.major }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: ${{ inputs.push == true }}
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.rev.outputs.short }}-${{ matrix.arch }}
          cache-from: type=gha,scope=os-${{ matrix.arch }}
          cache-to: type=gha,scope=os-${{ matrix.arch }},mode=max

      - name: Check and measure the image
        env:
          TAG: ${{ env.IMAGE }}:${{ steps.rev.outputs.short }}-${{ matrix.arch }}
        run: |
          docker run --rm "$TAG" ros2 pkg list > pkgs.txt
          grep -E '^(mowbite_|tron_|xcore_|platform_)' pkgs.txt
          # At least one platform entered its name in the index.
          docker run --rm "$TAG" python3 -c \
            'import sys; from ament_index_python import get_resources; sys.exit(not get_resources("mowbite_platform"))'
          if grep -q '^mowbite_sim$' pkgs.txt; then echo "mowbite_sim must not be in the image"; exit 1; fi
          docker run --rm "$TAG" python3 -c 'import mowbite_planner_os.node'
          # The app docker/os.Dockerfile pins came along.
          app=$(docker run --rm "$TAG" python3 -c \
            'import json; print(json.load(open("/opt/mowbite_app/app.json"))["version"])')
          # The label the updater reads, as in docker/min_app and in its form.
          min_app=$(docker image inspect --format '{{ index .Config.Labels "mowbite.min_app" }}' "$TAG")
          if [ "$min_app" != "$(cat docker/min_app)" ] \
             || ! printf '%s' "$min_app" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?'; then
            echo "::error::label mowbite.min_app is '$min_app'"; exit 1
          fi
          docker image inspect --format '{{json .Config.Healthcheck}}' "$TAG" | grep -q mowbite_health
          # Without a broker the health check runs and says why it fails.
          health=/ws/install/mowbite_bridge/lib/mowbite_bridge/mowbite_health
          rc=0; docker run --rm --network none --entrypoint "$health" "$TAG" > health.txt || rc=$?
          cat health.txt
          if [ "$rc" -ne 1 ] || ! grep -q '^MQTT_UNREACHABLE 127.0.0.1:1883' health.txt; then exit 1; fi
          docker run --rm "$TAG" python3 /ws/tools/measure.py --help > /dev/null
          docker run --rm "$TAG" python3 /ws/tools/xcore_capture.py --help > /dev/null
          # docker exec does not pass the entrypoint: the command measure sources the workspace itself.
          docker run --rm --entrypoint /usr/local/bin/measure "$TAG" --help > /dev/null
          size=$(docker image inspect --format '{{.Size}}' "$TAG")
          packed=$(docker save "$TAG" | gzip -1 | wc -c)
          {
            echo "### ${{ matrix.arch }}"
            echo "- image: \`$TAG\`"
            echo "- size unpacked: $((size / 1000000)) MB, saved and gzipped: $((packed / 1000000)) MB"
            echo "- packages: $(grep -cE '^(mowbite_|tron_|xcore_|platform_)' pkgs.txt)"
            echo "- mowbite.min_app: $min_app"
            echo "- app: $app"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the image with gzip layers
        if: matrix.arch == 'arm64'
        env:
          TAG: ${{ env.IMAGE }}:${{ steps.rev.outputs.short }}-${{ matrix.arch }}
          ARCHIVE: mowbite-os-${{ steps.rev.outputs.short }}-${{ matrix.arch }}.tar
        run: |
          docker save "$TAG" | gzip -1 > saved.tar.gz
          python3 -I tools/yf/repack_gzip.py saved.tar.gz repacked
          mv repacked/image.tar "$ARCHIVE"
          rm -r saved.tar.gz repacked
          # The repacked archive loads back with the same layers.
          layers=$(docker image inspect --format '{{json .RootFS.Layers}}' "$TAG")
          docker rmi "$TAG" > /dev/null
          docker load -i "$ARCHIVE"
          test "$(docker image inspect --format '{{json .RootFS.Layers}}' "$TAG")" = "$layers"
          docker run --rm "$TAG" python3 /ws/tools/measure.py --help > /dev/null
          {
            echo "- archive with gzip layers: \`$ARCHIVE\`, $(( $(stat -c %s "$ARCHIVE") / 1000000 )) MB"
            echo "- sha256: $(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'arm64'
        with:
          name: mowbite-os-${{ steps.rev.outputs.short }}-${{ matrix.arch }}
          path: mowbite-os-${{ steps.rev.outputs.short }}-${{ matrix.arch }}.tar
          retention-days: 5
          compression-level: 0
          if-no-files-found: error

      # The same build as a bundle for mowbite-update on the Tron (no Docker there), signed later by the owner.
      - name: Bundle for the Tron
        if: matrix.arch == 'arm64'
        env:
          TAG: ${{ env.IMAGE }}:${{ steps.rev.outputs.short }}-${{ matrix.arch }}
        run: |
          mkdir bundle
          platform/tron/bundle/make-bundle.sh "$TAG" bundle | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'arm64'
        with:
          name: mowbite-os-bundle-${{ steps.rev.outputs.short }}
          path: bundle/mowbite-os-*.tar.gz
          retention-days: 5
          compression-level: 0
          if-no-files-found: error

  manifest:
    if: inputs.push
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures
        run: |
          short=${GITHUB_SHA::7}
          docker buildx imagetools create -t "$IMAGE:$short" "$IMAGE:$short-amd64" "$IMAGE:$short-arm64"
          docker buildx imagetools inspect "$IMAGE:$short"
