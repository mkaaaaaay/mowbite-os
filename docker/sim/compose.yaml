# MowBite OS against the simulated MCU, with mosquitto and the MowBite app, all on the PC.
#   docker compose -f docker/sim/compose.yaml up -d --build      (in the repo)
#   docker compose -f docker/sim/compose.yaml down
# App: http://<OMTRON_HOST>:48082, MQTT 41883, WebSocket 49001. OMTRON_HOST (default localhost) can be set in
# docker/sim/.env, e.g. to the LAN address of the PC for phones. Sensor flags of the simulated MCU, e.g. lift:
#   docker exec omtron-mowbite_os-1 sh -c 'echo "{\"lift\": 1}" > /tmp/mowbite_sim_flags.json'
name: omtron
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "2"
services:
  mosquitto:
    image: eclipse-mosquitto:2
    labels:
      - com.centurylinklabs.watchtower.enable=false
    logging: *logging
    ports:
      - "${OMTRON_MQTT_PORT:-41883}:1883"
      - "${OMTRON_WS_PORT:-49001}:9001"
      - "${OMTRON_APP_PORT:-48082}:8080"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  mowbite_os:
    build:
      context: ../..
      dockerfile: docker/sim.Dockerfile
    image: local/mowbite-os-sim:dev
    labels:
      - com.centurylinklabs.watchtower.enable=false
    logging: *logging
    network_mode: "service:mosquitto"
    # The journal in the container, at most journal_max_mb of sim.yaml: docker exec ... mowbite_replay check <dir>
    environment:
      - MOWBITE_JOURNAL_DIR=/tmp/mowbite_sim_journal
    command: ["ros2", "launch", "mowbite_sim", "sim.launch.py"]
    # SIGINT so that launch stops every node and tron_mcu switches the blade off (it ignores SIGTERM as PID 1).
    stop_signal: SIGINT
    stop_grace_period: 20s
  mowbite:
    image: ${OMTRON_APP_IMAGE:-ghcr.io/mkaaaaaay/mowbite:1.4.0-beta.16}
    labels:
      - com.centurylinklabs.watchtower.enable=false
    logging: *logging
    network_mode: "service:mosquitto"
    environment:
      - MOWER_MQTT_WS_URL=ws://${OMTRON_HOST:-localhost}:${OMTRON_WS_PORT:-49001}
      - MOWER_MQTT_HOST=localhost
      - MOWER_MQTT_PORT=1883
    volumes:
      - mowbite_data:/data
      # The mower's network for /cgi-bin/system of the app (wifi_signal). On the Tron the host's /proc/1/net goes there;
      # the PC has no wifi, so the simulation only has a fixed wlan0 at -56 dBm (no file can be mounted over procfs).
      - ./host-net:/host-net:ro
volumes:
  mowbite_data:
