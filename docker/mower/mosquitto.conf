# Broker of MowBite OS on the mower: plain MQTT for the OS and the app container, WebSocket for the app in a browser.
# Without a login, like the broker the app knows from OpenMower; nothing is kept over a restart.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
allow_anonymous true

listener 1883

listener 9001
protocol websockets
