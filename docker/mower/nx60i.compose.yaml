# MowBite OS on the YardForce NX60i (OpenMower v2, xCore over Ethernet): broker and OS on the host network; the app runs
# in a stack of its own. The image carries this file with mosquitto.conf and env.example (/usr/share/mowbite-os/mower).
# The OS starts only with the profile os (docker compose --profile os up -d), on the user's word (A4); OpenMower and its
# broker are stopped first, never two programs at the board. The parameter file of this mower lies in data_dir as
# nx60i.yaml (ticks_per_meter, wheel_distance, the values of the safety measurement); without its date only remote
# control. Label mowbite.os, never mowbite.update=on: the MowBite Updater leaves these containers alone.
name: mowbite-os
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: mowbite-mosquitto
    restart: unless-stopped
    network_mode: host
    logging: *logging
    labels:
      - mowbite.os=true
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  os:
    profiles: ["os"]
    image: ghcr.io/mkaaaaaay/mowbite-os:${MOWBITE_OS_TAG:?set MOWBITE_OS_TAG in .env}
    container_name: mowbite-os
    restart: unless-stopped
    # The xCore announces its services by multicast and talks UDP on eth0.
    network_mode: host
    logging: *logging
    labels:
      - mowbite.os=true
      - mowbite.update.name=mowbite-os
    volumes:
      - ${MOWBITE_DATA_DIR:?set MOWBITE_DATA_DIR in .env}:${MOWBITE_DATA_DIR}
      # The journal of the cores, outside of data_dir; limits in platform.yaml of the platform (writing stops below
      # 200 MB free there). An .env from before the journal works with the default.
      - ${MOWBITE_JOURNAL_DIR:-/var/lib/mowbite-journal}:/var/lib/mowbite-journal
      # OpenMower's folders of the map and of mower_params.yaml, read only: taken over on the first start with an
      # empty data_dir. The way back writes map.json and report.json to ./export (mowbite-migrate export /export).
      - ${MOWBITE_IMPORT_ROS:-/home/openmower/ros}:/import/openmower/ros:ro
      - ${MOWBITE_IMPORT_PARAMS:-/home/openmower/params}:/import/openmower/params:ro
      - ./export:/export
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - MOWBITE_OS_IMAGE=ghcr.io/mkaaaaaay/mowbite-os:${MOWBITE_OS_TAG}
      # The platform of this mower, a value of the device from .env: an update leaves it as it is.
      - MOWBITE_PLATFORM=${MOWBITE_PLATFORM:-nx60i}
      - MOWBITE_IMPORT_DIR=/import/openmower
      # For mowbite-migrate export.
      - MOWBITE_DATA_DIR=${MOWBITE_DATA_DIR}
      - ROS_LOG_DIR=/tmp/ros_log
    tmpfs:
      - /tmp/ros_log:size=20m
    # The driver with hold_file <data_dir>/hold.json, the parameter file of this mower in data_dir and the datum of the
    # garden.
    command: ["ros2", "launch", "mowbite_bringup", "mowbite.launch.py", "data_dir:=${MOWBITE_DATA_DIR}",
              "journal_dir:=/var/lib/mowbite-journal", "datum_lat:=${MOWBITE_DATUM_LAT:?}",
              "datum_long:=${MOWBITE_DATUM_LONG:?}", "datum_height:=${MOWBITE_DATUM_HEIGHT:?}"]
    # SIGINT so that launch stops every node and xcore_driver sends its stops; it ignores SIGTERM as PID 1.
    stop_signal: SIGINT
    stop_grace_period: 20s
    ulimits:
      core: 0
