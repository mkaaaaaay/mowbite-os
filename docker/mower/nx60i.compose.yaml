# MowBite OS on the YardForce NX60i (OpenMower v2, xCore over Ethernet): broker, OS and app on the host network. The OS
# starts only with the profile os (docker compose --profile os up -d), on the user's word (A4); OpenMower and its broker
# are stopped first, never two programs at the board. The parameter file of this mower lies in data_dir as nx60i.yaml
# (ticks_per_meter, wheel_distance, the values of the safety measurement); without its date only remote control.
# No label mowbite.update=on yet, as on the Tron.
name: mowbite-os
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mowbite-mosquitto
    restart: unless-stopped
    network_mode: host
    logging: *logging
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  os:
    profiles: ["os"]
    image: ghcr.io/mkaaaaaay/mowbite-os:${MOWBITE_OS_TAG:?set MOWBITE_OS_TAG in .env}
    container_name: mowbite-os
    restart: unless-stopped
    # The xCore announces its services by multicast and talks UDP on eth0.
    network_mode: host
    logging: *logging
    labels:
      - mowbite.update.name=mowbite-os
    volumes:
      - ${MOWBITE_DATA_DIR:?set MOWBITE_DATA_DIR in .env}:${MOWBITE_DATA_DIR}
      # The journal of the cores, outside of data_dir; limits in nx60i.yaml of mowbite_bringup (writing stops below 200 MB
      # free there). An .env from before the journal works with the default.
      - ${MOWBITE_JOURNAL_DIR:-/var/lib/mowbite-journal}:/var/lib/mowbite-journal
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - MOWBITE_OS_IMAGE=ghcr.io/mkaaaaaay/mowbite-os:${MOWBITE_OS_TAG}
      - ROS_LOG_DIR=/tmp/ros_log
    tmpfs:
      - /tmp/ros_log:size=20m
    # xcore_driver with hold_file <data_dir>/hold.json, the parameter file of this mower and the datum of the garden.
    command: ["ros2", "launch", "mowbite_bringup", "nx60i.launch.py", "data_dir:=${MOWBITE_DATA_DIR}",
              "journal_dir:=/var/lib/mowbite-journal",
              "mower_params:=${MOWBITE_DATA_DIR}/nx60i.yaml", "datum_lat:=${MOWBITE_DATUM_LAT:?}",
              "datum_long:=${MOWBITE_DATUM_LONG:?}", "datum_height:=${MOWBITE_DATUM_HEIGHT:?}"]
    # SIGINT so that launch stops every node and xcore_driver sends its stops; it ignores SIGTERM as PID 1.
    stop_signal: SIGINT
    stop_grace_period: 20s
    ulimits:
      core: 0
  mowbite:
    image: ghcr.io/mkaaaaaay/mowbite:${MOWBITE_APP_TAG:?set MOWBITE_APP_TAG in .env}
    container_name: mowbite
    restart: unless-stopped
    network_mode: host
    logging: *logging
    environment:
      - MOWER_MQTT_WS_URL=ws://${MOWER_HOST:?set MOWER_HOST in .env}:9001
      - MOWER_MQTT_HOST=localhost
      - MOWER_MQTT_PORT=1883
    volumes:
      - /opt/stacks/mowbite-os/app-data:/data
      - /proc/1/net:/host-net:ro
