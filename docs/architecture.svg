<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 716" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How MowBite OS is built</title>
  <rect width="960" height="716" rx="16" fill="#101114"/>

  <g fill="none" stroke="#3a3d47" stroke-width="2" stroke-linecap="round">
    <path d="M480 86 V178"/>
    <path d="M600 204 H680"/>
    <path d="M480 230 V254"/>
    <path d="M480 306 V330"/>
    <path d="M480 420 V444"/>
    <path d="M480 496 V548"/>
    <path d="M480 600 V624"/>
  </g>

  <text x="40" y="62" font-size="13" fill="#9a9ba0" letter-spacing="1">PHONE OR BROWSER</text>
  <rect x="360" y="30" width="240" height="56" rx="10" fill="#16202f" stroke="#5b9df0" stroke-width="1.5"/>
  <text x="480" y="64" font-size="17" font-weight="600" fill="#f1f1f1" text-anchor="middle">MowBite app</text>
  <text x="498" y="112" font-size="13" fill="#9a9ba0">MQTT and JSON-RPC,</text>
  <text x="498" y="130" font-size="13" fill="#9a9ba0">the interface of OpenMower</text>

  <rect x="24" y="148" width="912" height="544" rx="14" fill="none" stroke="#2a2d35" stroke-width="1.5" stroke-dasharray="6 6"/>
  <rect x="40" y="138" width="132" height="20" fill="#101114"/>
  <text x="52" y="153" font-size="13" fill="#9a9ba0" letter-spacing="1">ON THE MOWER</text>

  <rect x="360" y="178" width="240" height="52" rx="10" fill="#181a20" stroke="#2a2d35" stroke-width="1.5"/>
  <text x="480" y="210" font-size="17" font-weight="600" fill="#f1f1f1" text-anchor="middle">MQTT broker</text>

  <rect x="680" y="172" width="232" height="64" rx="10" fill="#181a20" stroke="#2a2d35" stroke-width="1.5"/>
  <text x="796" y="199" font-size="17" font-weight="600" fill="#f1f1f1" text-anchor="middle">mowbite-host</text>
  <text x="796" y="221" font-size="13" fill="#9a9ba0" text-anchor="middle">updates, runs beside the OS</text>

  <rect x="200" y="254" width="560" height="52" rx="10" fill="#181a20" stroke="#2a2d35" stroke-width="1.5"/>
  <text x="224" y="286" font-size="17" font-weight="600" fill="#f1f1f1">Bridge</text>
  <text x="736" y="286" font-size="13" fill="#9a9ba0" text-anchor="end">topics, RPC methods and events of the app interface</text>

  <rect x="48" y="330" width="864" height="90" rx="10" fill="#181a20" stroke="#2a2d35" stroke-width="1.5"/>
  <text x="72" y="356" font-size="13" fill="#9a9ba0">The same for every mower</text>
  <g font-size="14" font-weight="600" fill="#f1f1f1" text-anchor="middle">
    <rect x="72" y="368" width="108" height="36" rx="8" fill="#22252d"/>
    <text x="126" y="391">Logic</text>
    <rect x="190" y="368" width="108" height="36" rx="8" fill="#22252d"/>
    <text x="244" y="391">Map</text>
    <rect x="308" y="368" width="108" height="36" rx="8" fill="#22252d"/>
    <text x="362" y="391">Schedule</text>
    <rect x="426" y="368" width="108" height="36" rx="8" fill="#22252d"/>
    <text x="480" y="391">Setup</text>
    <rect x="544" y="368" width="108" height="36" rx="8" fill="#22252d"/>
    <text x="598" y="391">Position</text>
    <rect x="662" y="368" width="108" height="36" rx="8" fill="#22252d"/>
    <text x="716" y="391">Follower</text>
    <rect x="780" y="368" width="108" height="36" rx="8" fill="#22252d"/>
    <text x="834" y="391">Planner</text>
  </g>

  <rect x="200" y="444" width="560" height="52" rx="10" fill="#241f12" stroke="#d4ac4a" stroke-width="1.5"/>
  <text x="224" y="476" font-size="17" font-weight="600" fill="#f1f1f1">Safety filter</text>
  <text x="736" y="476" font-size="13" fill="#d4ac4a" text-anchor="end">every drive command passes here</text>

  <path d="M48 522 H912" stroke="#4cbf72" stroke-width="1.5" stroke-dasharray="3 6" stroke-linecap="round"/>
  <rect x="404" y="508" width="152" height="28" rx="14" fill="#13241a" stroke="#4cbf72" stroke-width="1.5"/>
  <text x="480" y="527" font-size="13" font-weight="600" fill="#4cbf72" text-anchor="middle">hw/* contract</text>

  <rect x="200" y="548" width="560" height="52" rx="10" fill="#181a20" stroke="#2a2d35" stroke-width="1.5"/>
  <text x="224" y="580" font-size="17" font-weight="600" fill="#f1f1f1">Driver</text>
  <text x="736" y="580" font-size="13" fill="#9a9ba0" text-anchor="end">one per mower, a process of its own</text>

  <rect x="200" y="624" width="560" height="52" rx="10" fill="#101114" stroke="#3a3d47" stroke-width="1.5"/>
  <text x="224" y="656" font-size="17" font-weight="600" fill="#f1f1f1">Board of the mower</text>
  <text x="736" y="656" font-size="13" fill="#9a9ba0" text-anchor="end">motors, blade, stop button, sensors</text>
</svg>
