<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How an update reaches the mower</title>
  <rect width="960" height="190" rx="16" fill="#101114"/>

  <g fill="none" stroke="#3a3d47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M192 89 l6 6 l-6 6"/>
    <path d="M380 89 l6 6 l-6 6"/>
    <path d="M568 89 l6 6 l-6 6"/>
    <path d="M756 89 l6 6 l-6 6"/>
  </g>

  <g>
    <rect x="20" y="20" width="168" height="150" rx="12" fill="#181a20" stroke="#2a2d35" stroke-width="1.5"/>
    <text x="36" y="52" font-size="12" font-weight="600" fill="#5b9df0" letter-spacing="0.6">GITHUB</text>
    <text x="36" y="84" font-size="18" font-weight="600" fill="#f1f1f1">Release</text>
    <g font-size="13" fill="#9a9ba0">
      <text x="36" y="112">Signed bundles,</text>
      <text x="36" y="131">listed in a signed</text>
      <text x="36" y="150">index.</text>
    </g>
  </g>
  <g>
    <rect x="208" y="20" width="168" height="150" rx="12" fill="#181a20" stroke="#2a2d35" stroke-width="1.5"/>
    <text x="224" y="52" font-size="12" font-weight="600" fill="#5b9df0" letter-spacing="0.6">ON THE MOWER</text>
    <text x="224" y="84" font-size="18" font-weight="600" fill="#f1f1f1">Check</text>
    <g font-size="13" fill="#9a9ba0">
      <text x="224" y="112">The mower looks</text>
      <text x="224" y="131">every 6 hours or</text>
      <text x="224" y="150">when you ask.</text>
    </g>
  </g>
  <g>
    <rect x="396" y="20" width="168" height="150" rx="12" fill="#181a20" stroke="#2a2d35" stroke-width="1.5"/>
    <text x="412" y="52" font-size="12" font-weight="600" fill="#5b9df0" letter-spacing="0.6">YOUR CHOICE</text>
    <text x="412" y="84" font-size="18" font-weight="600" fill="#f1f1f1">Install</text>
    <g font-size="13" fill="#9a9ba0">
      <text x="412" y="112">Your tap in the app,</text>
      <text x="412" y="131">or at night if you</text>
      <text x="412" y="150">switch that on.</text>
    </g>
  </g>
  <g>
    <rect x="584" y="20" width="168" height="150" rx="12" fill="#241f12" stroke="#d4ac4a" stroke-width="1.5"/>
    <text x="600" y="52" font-size="12" font-weight="600" fill="#d4ac4a" letter-spacing="0.6">ONLY AT REST</text>
    <text x="600" y="84" font-size="18" font-weight="600" fill="#f1f1f1">Switch</text>
    <g font-size="13" fill="#c9bf9f">
      <text x="600" y="112">While the mower</text>
      <text x="600" y="131">stands in its station</text>
      <text x="600" y="150">without an emergency.</text>
    </g>
  </g>
  <g>
    <rect x="772" y="20" width="168" height="150" rx="12" fill="#13241a" stroke="#4cbf72" stroke-width="1.5"/>
    <text x="788" y="52" font-size="12" font-weight="600" fill="#4cbf72" letter-spacing="0.6">WITH A WAY BACK</text>
    <text x="788" y="84" font-size="18" font-weight="600" fill="#f1f1f1">Verify</text>
    <g font-size="13" fill="#a3b8a9">
      <text x="788" y="112">Healthy: it stays.</text>
      <text x="788" y="131">If not, the version</text>
      <text x="788" y="150">before comes back.</text>
    </g>
  </g>
</svg>
