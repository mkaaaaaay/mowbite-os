# mDNS only in the home network (wlan0), never on the setup access point (wlan1); the installer finds the mower by
# its _mowbite._tcp service under the host name from the pack.
[server]
use-ipv4=yes
use-ipv6=yes
allow-interfaces=wlan0
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-workstation=no
publish-hinfo=no

[reflector]

[rlimits]
