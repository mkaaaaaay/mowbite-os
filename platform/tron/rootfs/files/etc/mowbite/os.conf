# Settings of this mower for mowbite-os.service over /usr/lib/mowbite/os.defaults; restart it after a change.
# true lets tron_mcu, the GNSS and the IMU node talk to the mower; read starts tron_mcu and the IMU node listening only
# (no byte to a port, nothing moves); false starts none of them (default).
#MOWBITE_HARDWARE=true
# on starts the camera AI as well (only with MOWBITE_HARDWARE=true); it needs its files in /userdata/mowbite-vision.
#MOWBITE_VISION=on
# on starts the live picture of the stereo camera as well (only with MOWBITE_HARDWARE=true).
#MOWBITE_STEREO=on
# on starts the right side camera as well (only with MOWBITE_HARDWARE=true): the camera AI with its live picture like
# MOWBITE_VISION; with MOWBITE_RIGHT_NODE=side only the live picture, which streams only while someone watches.
#MOWBITE_RIGHT=on
#MOWBITE_RIGHT_NODE=side
# on starts the dock marker of the rear camera with its live picture as well (only with MOWBITE_HARDWARE=true); it
# measures only on request, the picture comes only while someone looks and never before the marker.
#MOWBITE_REAR=on
# The datum of the garden; without it the GNSS node publishes nothing.
#MOWBITE_DATUM_LAT=
#MOWBITE_DATUM_LONG=
#MOWBITE_DATUM_HEIGHT=
