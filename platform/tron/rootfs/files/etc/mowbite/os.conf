# Settings of this mower for mowbite-os.service over /usr/lib/mowbite/os.defaults; restart it after a change.
# true lets tron_mcu, the GNSS and the IMU node talk to the mower; read starts tron_mcu and the IMU node listening only
# (no byte to a port, nothing moves); false starts none of them (default).
#MOWBITE_HARDWARE=true
# The datum of the garden; without it the GNSS node publishes nothing.
#MOWBITE_DATUM_LAT=
#MOWBITE_DATUM_LONG=
#MOWBITE_DATUM_HEIGHT=
