# Values of the simulated Tron on top of stack.yaml and its platform.yaml (sim.launch.py passes this file as extra_config).
/**:
  ros__parameters:
    # The journal of a simulation (journal_dir from MOWBITE_JOURNAL_DIR) stays small on the PC.
    journal_platform: sim
    journal_max_mb: 256.0
    journal_max_days: 3.0
tron_mcu:
  ros__parameters:
    # fake_tron stands in for the safety measurement, so that the simulation drives on its own. Never on a device.
    safety_measurement_date: "simulation"

mowbite_setup:
  ros__parameters:
    # setup.ports lists the ports of the drivers only, never the serial devices of the machine the simulation runs on.
    ports_scan: false

mowbite_logic:
  ros__parameters:
    geometry:
      # fake_tron puts the antenna 0.098 m ahead of the base (its --antenna-offset); the localization has to know it.
      antenna_x: 0.098
      antenna_y: 0.0

mowbite_ntrip:
  ros__parameters:
    # The access over RPC, for the app and app_interface_check. The broker of the simulation is open: test access only,
    # never the real one.
    access_over_rpc: true

mowbite_light:
  ros__parameters:
    # Offers light.* like a Tron with released lights; the frame goes to a file (tmpfs, written atomically).
    output: file
    file: /dev/shm/mowbite_sim_light.bin

# The charging station of fake_tron, which is no ROS node: sim.launch.py passes it on. Placed like one of map.json:
# base_link of the docked mower (m) and the way in (degrees). 1 m behind the start the mower backs in going west and
# faces east on the contacts. dock_contact_x is where the simulated Tron has its contacts; mowbite_logic has the same
# value from geometry.yaml of the Tron.
fake_tron:
  ros__parameters:
    dock: [-1.0, 0.0, 180.0]
    dock_contact_x: -0.10
