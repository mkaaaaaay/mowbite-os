# Parameters of MowBite OS on the Tron. Values marked as assumption are checked in phase 6.

# Shared by all nodes, so it is set only here.
/**:
  ros__parameters:
    # GPS counts as good up to this accuracy in m: the localization fuses only such fixes, the logic works only with
    # such a position. Without a usable fix for gps_timeout s the position counts as lost. Start values: what an app
    # sets with params.set is saved by the logic and sent to the localization and the follower.
    max_position_accuracy: 0.1
    gps_timeout: 10.0
    # RTK fixed on corrections older than max_correction_age s, or without their age in GGA, counts as float (G7);
    # mowbite_ntrip reports CORRECTIONS LOST at the same age. Assumption until phase 7.
    max_correction_age: 30.0
    # The journal in journal_dir (launch argument): all runs of all processes together at most journal_max_mb and
    # journal_max_days (whole old runs go first); below journal_reserve_mb free on its file system nothing is written.
    journal_platform: tron
    journal_max_mb: 2048.0
    journal_max_days: 14.0
    journal_reserve_mb: 1024.0
    # The dock marker of the rear camera (hw/dock_marker): x, y (m) and yaw (rad) of the marker in base_link of the
    # docked mower (M3b 13.11.: seen by the camera from 0.1 to 0.8 m and carried to the docked pose); it leaves
    # the image marker_blind_distance m before the docked pose (M3c, estimated) and is found up to marker_range m
    # (every image up to 1.2 m, measured 14.11. in a dark room with the station lit); an image older than
    # marker_max_age s on arrival is dropped (M5). marker_range 0: no marker, no localization/dock_pose.
    dock_marker: [-0.160, 0.0, 0.0]
    marker_blind_distance: 0.07
    marker_range: 1.2
    marker_max_age: 0.3
    # The contact stretch of docking (mowbite_logic, below) ends dock_overshoot m past the station or contact_timeout s
    # after the gate; the pose at the station stays good without the marker for that long.
    dock_overshoot: 0.05
    contact_timeout: 10.0
    # m the position has to be at least at the station: in the map for the reference check and the gate of docking
    # (mowbite_logic), from the marker for every drive in the station frame (mowbite_follower, mowbite_safety).
    # Assumption until phase 7.
    dock_max_position_accuracy: 0.03
    # From the marker the limit grows by this per m from the docked place: its direction errs 3 to 5 degrees (M3b),
    # which moves the pose sideways by that angle times the distance; at the contacts it stays near the limit above.
    dock_accuracy_per_m: 0.09
tron_mcu:
  ros__parameters:
    port: /dev/ttyS9
    send_imu: true
    # The MCU stops the wheels ~0.2 s after the last SpeedData, also with heartbeat and IMU (measured 07.11.), but at
    # 20 SpeedData/s it kept a setpoint up to 3.6 s without host (08.11.). The driver sends motion at most every 100 ms.
    # After cmd_vel_timeout s without hw/cmd_vel come three stops. speed_repeat_window > 0 repeats the last setpoint
    # every 100 ms for that long instead, stops at its end and needs a measurement on the Tron first.
    cmd_vel_timeout: 0.5
    speed_repeat_window: 0.0
    telemetry_timeout: 1.0
    allow_blade: false
    # Defaults for blade requests that leave speed or height at 0. The speed changes nothing on firmware 0.6.36: the
    # motor turned at about 3000 rpm at 30 and at 100 % (measured 2026-11-11; below 30 and above 100 not measured).
    blade_speed_percent: 100
    mow_height_mm: 60
    # Longest blade lease in s; without a renewal the blade goes off when it runs out.
    blade_lease_max: 2.0
    bumper_latches_emergency: true
    # The MCU tells tilt only from the forwarded IMU: without a sample for imu_timeout s motion and blade are blocked
    # (G1, G10). The first sample may take imu_start_timeout s after the start (the IMU runs in another process, G25),
    # blocked as well but without an emergency. An off frame is not confirmed: a blade still at blade_still_rpm or more
    # blade_stop_time s after it went off blocks as well and is sent off again (G23). The IMU times are assumptions
    # until measured on the Tron. With the disc on, the blade stood within 0.6 s of every off, STOP, bumper, lift and
    # lost host (measured 2026-11-14).
    imu_timeout: 0.5
    imu_start_timeout: 2.0
    blade_stop_time: 1.5
    blade_still_rpm: 100
    # STOP at the mower releases the emergency (G37): free 2 s, then a short press (0.1 to 2 s). The driver reports it
    # on hw/button, the logic releases as for emergency.reset. The MCU keeps stop until a clear frame (measured
    # 2026-11-15), so the gesture works only with stop_clear_period > 0: STOP cleared every stop_clear_period s during
    # the emergency, from stop_clear_delay s after the latch on; a held STOP stays shown. The MCU no longer locks itself
    # then: before the first such clear the driver writes data_dir/stop-clear-mark, and a start with it latches. 0 until
    # the gesture passed its measurement on this Tron.
    stop_release: true
    stop_clear_period: 0.0
    stop_clear_delay: 1.5
    # Set after reading the versions of this Tron in phase 4.
    expected_cutter_version: ""
    expected_chassis_version: ""
    # Set after the safety measurement in phase 6 (hw/capabilities): the time the MCU keeps the last setpoint without
    # a heartbeat in s (-1 unknown), and the date of the measurement. Without the date only remote control.
    failsafe_without_host: -1.0
    safety_measurement_date: ""

tron_gnss:
  ros__parameters:
    port: /dev/ttyS4
    # Assumption from the reference documentation, checked on the device.
    baud: 115200
    # max_correction_age: under /** above.
    # RTK board in front of the UM960: $GNRTK,ON every board_keepalive s while RTCM came within board_active_window s,
    # RTKRESET when it falls back from ON on its own. RTCM goes to the port only while it reports ON (board_gate).
    board_keepalive: 4.0
    board_active_window: 10.0
    board_reset_on_off: true
    board_gate: true
    # The motion vector comes from the RTK fixed positions, not from the course of the board, which holds it fixed
    # (motion_from_fixes and its limits in tron_gnss/gnss_tracker.h).
    # With data_dir/ntrip.yaml (tron.launch.py sets data_dir) RTK fixed counts as float until the first NTRIP
    # corrections went to the receiver: before that a LoRa base with a reference of its own may give the fix (G24).
    # The datum of the garden comes only from MOWBITE_DATUM_* in /etc/mowbite/os.conf: tron.launch.py overrides files.

mowbite_ntrip:
  ros__parameters:
    # Access in data_dir/ntrip.yaml (host, port, mountpoint, user, password, version), filled in by the user on the
    # mower, mode 600; template in mowbite_bringup/config/ntrip.yaml.example. Read every config_check s.
    config_check: 5.0
    # ntrip.set and ntrip.delete (the access over RPC, only in IDLE); ntrip.get is always there. Off until MQTT writes
    # need a login and rpc/request cannot be read without one (G13): the password goes through rpc/request.
    access_over_rpc: false
    connect_timeout: 10.0
    # After a failure the next attempt after first_retry s, doubled up to max_retry; after a refused login rejected_retry
    # (or at once when the file changes). No byte for data_timeout s ends a connection. GGA every gga_interval s; the
    # first attempt waits up to gga_wait s for one (a VRS mountpoint sends nothing before it).
    first_retry: 5.0
    max_retry: 300.0
    rejected_retry: 300.0
    data_timeout: 15.0
    gga_interval: 10.0
    gga_wait: 60.0
    # The CORRECTIONS event LOST after max_correction_age (/** above) without corrections, RESTORED once when they are
    # back, SOURCE_CHANGED with the first corrections from another caster, port or mountpoint than the ones used last
    # (data_dir/ntrip_source.json, kept over restarts and ntrip.delete).

tron_imu:
  ros__parameters:
    port: /dev/ttyS1
    baud: 115200
    # The sensor sits upright (measured 07.11.). Gravity up at rest stops imu/data, see tron_imu.
    mount_roll_deg: 0.0

mowbite_localization:
  ros__parameters:
    gyro_calibration_time: 5.0
    # A calibration window counts only with the wheels reported still, no sample more than gyro_still_spread rad/s
    # off its mean and an offset of gyro_offset_limit rad/s or less; following at rest stays within the limit too.
    # Assumptions for the Tron until phase 5.
    gyro_still_spread: 0.02
    gyro_offset_limit: 0.02
    # Wheels below min_speed (m/s, and rad/s for their turn) stand: the standing Tron reports up to 0.011 m/s and
    # 0.028 rad/s, a wheel moves from ~0.06 m/s (measured 07./08.11.). Above it they move after motion_confirm_time s.
    min_speed: 0.04
    motion_confirm_time: 0.1
    # The antenna offset is part of the geometry (config/geometry/tron.yaml, robot.geometry), measured in phase 7.
    # Without a fix the accuracy grows by this much per m driven and per s. Assumptions until measured in phase 7.
    accuracy_growth_per_m: 0.05
    accuracy_growth_per_s: 0.01
    # Random walk of the filter: position in m per square root of m driven, heading in rad per square root of s the
    # gyro integrates. How old (s) a GNSS position is when it arrives, 0 until the UM960 is measured in phase 7.
    # Assumptions until phases 6 and 7.
    odometry_noise: 0.03
    gyro_noise: 0.005
    gnss_latency: 0.0

mowbite_logic:
  ros__parameters:
    # The kernel record of the rootfs (mowbite-crash): after a kernel crash the restart hold stands in every state.
    crash_record: /run/mowbite/crash
    # 6S Li-ion. empty is 0 % for the app and where mowing goes home: the highest voltage of battery_low_window s below
    # it (assumption, 3.5 V per cell, until the discharge curve is measured). The start checks
    # critical < empty < full.
    battery_empty_voltage: 21.0
    battery_full_voltage: 25.2
    battery_low_window: 20.0
    dock_charge_voltage: 28.0
    # localization/pose older than this (s) counts as lost: accuracy 999, GPS 0.
    pose_timeout: 2.0
    # s without a sign of the follower (it sends feedback every 0.5 s) while it has a path: the logic ends the path
    # itself and stops the mower and the blade (G22). Assumption until phase 6.
    follower_timeout: 2.0
    # Area recording: smallest area in m², most points of one recording (the map must fit one MQTT message), distance
    # in m between the two points of the docking station, and how long (s) a save waits for mowbite_map. Both points of
    # the station need a valid heading, the one on the contacts the contact.
    recording_min_area: 0.05
    recording_max_points: 5000
    recording_min_dock_distance: 0.5
    map_edit_timeout: 5.0
    # The charging contacts lie 0.10 m behind base_link (geometry.dock_contact_x): the Tron backs onto the docking
    # station and faces away from it there. On the contacts mowing and drives start only after the reference check
    # (G24): position accuracy at least dock_max_position_accuracy m (under /**), then with the heading of the station
    # set, base_link within dock_reference_limit m of the recorded station (assumptions until phase 7).
    dock_reference_limit: 0.10
    # After the check charging goes off (hw/charge), then the mower leaves the station undock_distance m straight
    # ahead without steering, at most undock_speed m/s: its wheels climb out of the 10 mm hollows of the station, a
    # crawl would stay in them. Standing undock_stall_time s while driven, or the way the GNSS antenna moves (RTK
    # fixed, from 0.3 m on) turning more than undock_course_limit degrees off the line of the station in the map, ends
    # undocking (UNDOCKING_FAILED).
    # undock_distance is a setting of params.set (0.5 to 2 m), the 0.8 m of the vendor. Assumptions until phase 7.
    undock_distance: 0.8
    undock_speed: 0.15
    undock_stall_time: 2.0
    undock_course_limit: 10.0
    # Docking after JOB_COMPLETE, abort_mowing and on docking.start: over the drivable areas to the point
    # docking_approach_distance m in front of the station, facing away from it, then backwards along its line at
    # docking_speed m/s, steered by RTK, or by the dock marker with dock_guide (below). dock_gate_distance m before the
    # station the mower stops: base_link at most dock_gate_lateral m beside the line, the heading within
    # dock_gate_heading degrees and the position at least dock_max_position_accuracy, else the try fails. Then at
    # contact_speed m/s up to dock_overshoot m past the station: the first raw contact stops it (three zero frames, then
    # nothing, G18), the debounced one is DOCKED. Standing contact_timeout s there without it, or undock_stall_time s
    # before the gate, fails the try: forwards out to the approach point like undocking, DOCKING_RETRY, after
    # docking_retry_count retries DOCKING_FAILED. docking_approach_distance (0.5 to 2 m) and docking_retry_count (0 to
    # 5) are settings of params.set; dock_overshoot and contact_timeout stand under /**. Assumptions until phase 7.
    docking_approach_distance: 0.8
    docking_retry_count: 4
    docking_speed: 0.1
    contact_speed: 0.06
    dock_gate_distance: 0.25
    dock_gate_lateral: 0.02
    dock_gate_heading: 8.0
    # A planner that gives no answer for the way to the point in front of the station within plan_timeout, or does
    # not run, does not keep the mower from it (docking_direct): the mower turns on the spot, drives the straight
    # line there and turns again (DOCKING_DIRECT), where no obstacle and no end of the mowing and navigation areas
    # lies closer to that line than the turning circle of the body plus direct_margin m plus max_position_accuracy.
    # The follower ends the leg once base_link is direct_margin m off the line. Not free, the try fails
    # (DOCKING_RETRY with cause and direct_blocked), and a way the planner refuses is never replaced. Platform
    # values, not settings of params.set. Assumptions until phase 7.
    docking_direct: true
    direct_margin: 0.15
    # docking.test docks by the dock marker alone (marker_range under /**), every leg in the station frame: it waits
    # up to marker_wait s for a good pose from the marker before a try fails, and when the marker was lost on the way
    # in; base_link may be marker_cross_track m off each path there; at the gate the way along the line by the marker
    # may differ from the way of the wheels by marker_scale_limit of it (a marker of the wrong size). Assumptions until
    # the docking test on the Tron (M7).
    marker_wait: 25.0
    marker_cross_track: 0.10
    marker_scale_limit: 0.15
    # docking.start and going home dock by the marker too (dock_guide): none never, prefer by the position where its
    # source cannot measure (DOCKING_WITHOUT_MARKER), require never without it. require until docking by RTK is
    # measured on the Tron (P7).
    dock_guide: require
    # The debounced contact is not DOCKED yet (G19): contact and a charge current of at least charge_confirm_current A
    # have to hold charge_confirm_time s without a gap, at charge_expected_below percent or more the contact alone, as
    # the charger stays off near full. Without either within charge_confirm_timeout s the try fails (NO_CHARGE_CURRENT):
    # charging off over hw/charge, out to the approach point, the next try; after the last one the mower stays on the
    # contacts (DOCKING_FAILED). In IDLE on the station CHARGING_LOST tells when the contact, or the current it had
    # below charge_expected_below, is gone for charge_lost_time s. The Tron charges with 3.3 to 4.2 A and draws 0.6 A
    # standing; tron_mcu sends Charge 1 with the debounced contact. Assumptions until phase 7.
    charge_confirm_current: 0.5
    charge_confirm_time: 5.0
    charge_confirm_timeout: 20.0
    charge_expected_below: 95.0
    charge_lost_time: 10.0
    # mowing.plan and the job ask the planner for a plan and set only what the request carries: width, passes and angle
    # are the planner's (mowbite_planner below). plan_timeout in s, also for the way to a path or to the station. A
    # job asks for a way again up to three times, standing with the blade off; after that, or once the plan of an area
    # got no answer, mowing ends, the job kept, and the mower goes home (DOCKING with the reason PLANNER_TIMEOUT).
    # Where it cannot go home it pauses as for a way or a plan that failed.
    plan_timeout: 30.0
    # Mowing. The blade turns only with mow_with_blade here and allow_blade of tron_mcu, and only on mow segments. It runs
    # on a lease of blade_lease s, renewed every blade_renew s. mower_spinup_rpm 0: no wait for the blade (Tron rpm not
    # measured yet); BLADES events from blade_running_rpm on. gps_wait_time s of good position before mowing goes on.
    # Below battery_critical_voltage for battery_critical_time s mowing goes home at once. ASSUMPTION until the
    # discharge curve and question 47 (iv): 3.28 V per cell, 2 s against dips under load. battery_hot_temperature (°C)
    # sends mowing home and stops a start, 0 for never (until question 47 (ii)). A path that
    # starts farther than approach_distance m away is reached over the drivable areas first. The checkpoint in data_dir
    # is written every checkpoint_period s while mowing.
    mow_with_blade: false
    blade_lease: 1.0
    blade_renew: 0.5
    mower_spinup_rpm: 0
    mower_spinup_timeout: 10.0
    blade_running_rpm: 100
    gps_wait_time: 10.0
    battery_critical_voltage: 19.7
    battery_critical_time: 2.0
    battery_hot_temperature: 0.0
    approach_distance: 0.5
    checkpoint_period: 30.0

mowbite_follower:
  ros__parameters:
    # m/s where the next metre of the path runs straight (within 20 degrees), elsewhere and on turns, and the limits
    # of every command (the lower of these and the limits in hw/capabilities); speeding up and braking at
    # acceleration m/s². Raised only after the driving tests of phase 6 and 7.
    speed_fast: 0.3
    speed_slow: 0.15
    speed_turn: 0.1
    max_linear: 0.3
    max_angular: 0.3
    acceleration: 0.1
    # rad/s an arc of the path asks for at most, below max_angular so that the mower can still correct on arcs of
    # turn_radius (0.25 * 0.44 = 0.11 m/s there).
    turn_rate: 0.25
    # Above the dead band of the wheels (~0.05 m/s each, estimated): creeping onto corners and the end at creep_speed
    # m/s, turning on the spot at min_turn_rate rad/s or faster (0.28 * 0.2 = 0.056 m/s per wheel).
    creep_speed: 0.06
    min_turn_rate: 0.28
    # Steering: beside the path the mower heads towards it at half of approach_angle degrees approach_distance m off;
    # heading errors decay at heading_gain 1/s.
    approach_distance: 0.15
    approach_angle: 45.0
    heading_gain: 2.0
    # Where the path turns by more than corner_angle degrees from one pose to the next (as where the planner turns on
    # the spot) and more than max_drive_angle degrees off the course, the mower turns on the spot.
    corner_angle: 15.0
    max_drive_angle: 45.0
    # Arcs tighter than min_arc_radius m are taken as corners too: below about 0.4 m the inner wheel would run under
    # its dead band at turn_rate (the bulb turns of the planner, 0.13 m). Assumption until phase 6.
    min_arc_radius: 0.3
    # A path starts at most max_start_distance m from its first pose and ends within goal_tolerance m of its last.
    max_start_distance: 1.0
    goal_tolerance: 0.1
    # Stops: no pose for pose_timeout s, base_link further than max_cross_track m from the path or geofence_margin m
    # outside of the allowed areas, a turn on the spot longer than phase_timeout s, less than 5 cm of progress along
    # the path in progress_timeout s (stuck). Assumptions.
    pose_timeout: 0.5
    max_cross_track: 0.5
    geofence_margin: 0.5
    phase_timeout: 20.0
    progress_timeout: 10.0
    control_rate: 20.0

mowbite_safety:
  ros__parameters:
    # S2, the only writer of hw/cmd_vel, checks every drive command of the logic. TILT: the body more than tilt_limit
    # degrees off the vertical for tilt_time s, for every source and also standing; a release needs it below
    # tilt_release (the Tron mows slopes up to 31 degrees, vendor; its MCU reports a lift from about 37). FENCE: an
    # autonomous drive with base_link more than fence_margin m outside of the active mow and navigation areas and the
    # line of the station, beyond the geofence_margin of the follower, so it acts only when the follower does not; in
    # the station frame (docking by the marker) the line of the station alone, with no map needed. Without an IMU
    # sample for 0.5 s nothing moves. Assumptions until phases 6 and 7.
    tilt_limit: 31.0
    tilt_time: 1.0
    tilt_release: 26.0
    fence_margin: 0.6

mowbite_map:
  ros__parameters:
    # Largest map.json in bytes (MQTT drops messages from about 2 MB) and the distance in m under which two datums count
    # as the same. The map is kept in data_dir, which tron.launch.py sets for the nodes that keep files.
    max_map_bytes: 1500000
    datum_tolerance: 0.01

mowbite_light:
  ros__parameters:
    # none until the lights are released on the mower: no light.* methods, nothing on spidev. spidev or file (sim).
    output: none
    device: /dev/spidev3.0
    # 55 lit (2 x 14 front, 27 top) of the 60 the chain is driven with.
    leds: 55
    # Chase and gradient run along each at once (seen from the mower): fronts left and right bottom up, the top bar
    # from both ends to the middle.
    strips: ["0-13", "14-27", "28-41", "54-42"]
    buffer_leds: 60
    frame_rate: 25.0
    # 120 of 255, full brightness of the vendor's patterns.
    max_brightness: 0.47
    # Assumptions until measured: the whole chain and one channel of an LED at 255.
    max_current_ma: 1200.0
    ma_per_channel: 20.0
    low_battery: 0.2

mowbite_sound:
  ros__parameters:
    # none until the speaker is released on the mower: no sound.* methods, no sound. alsa or file (sim).
    output: none
    device: plughw:0,0
    # Gain at volume 100 (0 to 1); the mixer stays as asound.state has it.
    max_volume: 1.0
    volume: 60
    min_gap: 10.0
    # The vendor's announcements (MP3, en-US), newest version first; converted once into <data_dir>/sounds.
    vendor_dirs:
      - /userdata/RobotData/upgrade/*/src/mower_task/mower_light_sound/sound_files
      - /userdata/RobotData/voice/sound_files
    # Situation=code of the vendor's sound_list.txt; DOCKING_START has none.
    vendor_codes:
      - MOWING_START=900001
      - MOWING_COMPLETE=900102
      - LOW_BATTERY=900105
      - RAIN_DETECTED=400005
      - MOWING_PAUSED=900010
      - AREA_RECORDING_MODE=900002
      - DOCKING_FAILED=900025
      - CHARGING_START=900011
      - CHARGING_DONE=900013
      - EMERGENCY=900017
      - LIFT_TRIGGERED=900018
      - SCHEDULE_START=900006

# tron_vision, the camera AI on a side camera: left with MOWBITE_VISION=on, right with MOWBITE_RIGHT=on as a second
# instance in the namespace /right. These values hold for both.
/**/tron_vision:
  ros__parameters:
    # The vendor's NPU runtime, model and class list, copied by hand from its update; never in repo, bundle or image.
    library_path: /userdata/mowbite-vision/librknnrt.so
    model_path: /userdata/mowbite-vision/model.rknn
    labels_path: /userdata/mowbite-vision/labels.txt
    # Inferences per second (0.5 to 5).
    infer_rate: 2.0
    # crop: the middle 3:4 of the frame fills the upright model input; pad: the whole frame with gray bars.
    fit: crop
    # Gray world white balance also for the inference, not only for the shown image.
    white_balance_inference: false
    # Vertical blanking of the sensor in lines; 0 leaves its 30 fps.
    vertical_blanking: 0
    # Pictures on camera/<camera_id>/jpeg only while someone subscribes, at most jpeg_max_rate per second (0.5 to 5)
    # and jpeg_max_kb each; the JPEG quality steps down to keep the size.
    # jpeg_max_rate, jpeg_max_kb, score_threshold, max_rss_mb and crash_dir: the defaults of the node. Left: camera_id
    # oa_left, NPU core 0, rtsp_port 8556 and the sensors vision_*, the defaults of the node too.

# Only what the right instance does otherwise; sensor_name and video_device follow camera_id.
/right/tron_vision:
  ros__parameters:
    camera_id: oa_right
    npu_core: 1
    rtsp_port: 8557
    # The sensors vision_right_state, vision_right_last and vision_right_rate ("Camera AI right").
    sensor_suffix: _right

# tron_stereo, the live picture of the stereo camera (MOWBITE_STEREO=on): bitrate_kbps, rtsp_port, capture_device,
# stream_name, encoder_library and crash_dir have the defaults of the node.
tron_stereo:
  ros__parameters:
    # The stream also runs while the blade runs or hw/status is missing. The self-test per boot (mower standing, blade
    # off), the pause when hot and the lock after a kernel crash stay. A kernel crash in the camera driver while mowing
    # leaves the blade without the host: the MCU then stops the blade motor by itself within 0.4 s (T6, without disc).
    stream_while_mowing: true

# tron_side, only the live picture of the right side camera (MOWBITE_RIGHT=on, MOWBITE_RIGHT_NODE=side), streaming only
# while a viewer is there:
# sensor_name, video_device, vertical_blanking, jpeg_max_rate, jpeg_max_kb, max_rss_mb and crash_dir have the defaults
# of the node.

# mowbite_camera, the pictures of these cameras for the app (starts with any of them): mjpeg_port, webrtc_port,
# ice_port, media_api_port, media_server and runtime_dir have the defaults of the node.
mowbite_camera:
  ros__parameters:
    # The host in the addresses of camera.stream; empty: the IPv4 address of the default route at that moment.
    public_host: ""

# tron_rear, the dock marker of the rear camera (MOWBITE_REAR=on), on request of the logic. Without lens, mount, marker
# side or pattern it reports NOT_SET_UP and never measures; a measured value for one mower goes to <data_dir>/tron.yaml.
# Beside it the live picture of the camera, only while a viewer is there and needing no calibration; the marker goes
# first: a request takes the camera from the viewer, and a picture never delays a measurement.
# device, eval_rate, max_exposure_ms, first_frame_s, frame_gap_s, jpeg_max_rate, jpeg_max_kb, max_rss_mb and crash_dir:
# the defaults of the node.
tron_rear:
  ros__parameters:
    # fx, fy, cx, cy (px at 1920x1080), k1, k2, p1, p2, k3 (plumb_bob): the vendor's value for all Trons, until M2.
    lens: [1540.499, 1539.740, 986.294, 520.626, -0.373942, 0.165317, -0.000099, -0.000519, 0.0]
    # x, y, z (m) and yaw, pitch, roll (rad) of the camera in base_link, measured on one Tron: pitch 2.2 deg down,
    # roll 1.0 deg; yaw and y are within about 1 deg and 4 mm.
    mount: [-0.105, 0.0, 0.074, 3.14159, 0.038, 0.017]
    # The marker of the station EC1: side of the black square (m) and its 4 x 4 inner cells (0xB532).
    marker_side: 0.04
    marker_pattern: 46386

mowbite_bridge:
  ros__parameters:
    mqtt_host: 127.0.0.1
    mqtt_port: 1883
    data_dir: /userdata/mowbite
    # Event history on the mower: at most this many days and MB, oldest days go first.
    event_history_days: 60
    event_history_max_mb: 20.0
    # Mowing track on the mower: at most this many days and MB, oldest files go first (the active job's file stays).
    position_history_days: 60
    position_history_max_mb: 50.0

mowbite_planner:
  ros__parameters:
    frame_id: map
    # The body and the blade (robot_*, mower_width, blade_*) are those of robot.geometry: the planner takes them from
    # /mowbite_geometry (bridge/params) and plans nothing before it has them. None of them counts here.
    # Lane overlap: lanes lie (1 - overlap) * mower_width apart. It holds for every plan, also the ones of
    # mowbite_logic. perimeter_passes: loops along the outline, an area's own outline_count in the map goes before it.
    overlap: 0.15
    perimeter_passes: 3
    # Turns forwards only, every lane change a U-turn of turn_radius with the lanes 2 * turn_radius apart (lane_order skip).
    # Turning on the spot only where no arc fits: the nose swings out about 56 cm. On 0.44 the inner wheel runs
    # 0.06 m/s at the follower's turn_rate 0.25 rad/s, about its dead band (estimated). Assumptions until driven in
    # phase 6 and 7.
    turn_radius: 0.44
    lane_order: skip
    turn_on_spot: false
    turn_types: [u_turn, bulb, detour]
    # MowBite OS drives every plan forwards, so none may hold a stretch to back up on.
    back_up_with_plan: false
    # Nobody listens to ~/coverage_path, so do not publish every plan.
    publish_path: false
    # data_dir/planner (tron.launch.py sets data_dir): plans kept and maps before at most this many days and MB.
    keep_days: 60
    keep_mb: 50.0

mowbite_clock:
  ros__parameters:
    # Whether the system clock from the real-time clock alone counts as safe, for 30 days after the last
    # synchronization. Off until measured on the mower: the kernel writes it back, its drift over at least 3 days
    # without network, 30 days times that drift under 5 min.
    rtc: false

mowbite_schedule:
  ros__parameters:
    # Whether plans may start the mower from the station. Off until the user turns it on after the gates (way home,
    # pushes, incidents, stop book, safety measurement).
    allowed: false
