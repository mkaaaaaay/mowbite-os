# The dimensions of the Tron: the values of robot.geometry, read by mowbite_logic as the parameters geometry.*. What the
# user enters with robot.geometry.set goes to data_dir/geometry.json and counts before these. base_link is the middle of
# the axle of the drive wheels, x points forward and y to the left, everything in m. Another platform brings a file like
# this one with its driver.
mowbite_logic:
  ros__parameters:
    geometry:
      # As the driver reports it (hw/capabilities, system.info).
      platform: airseekers_tron
      # The body: 0.47 m over the drive wheels, the front 0.60 m ahead of their axle (set by the user), behind it the
      # wheels (radius 0.1125 m) and the charging contacts (0.10 m), rounded to 0.12 m. The planner keeps its margins to
      # the lines by it.
      robot_width: 0.47
      robot_front: 0.60
      robot_rear: 0.12
      # The real contour from above as x0, y0, x1, y1, ... (measured by the user, 15.11.): the bar in front is straight
      # over 0.28 m at the front, its ends 0.45 m apart and 0.07 m further back; from there to the back the full width.
      # The bevel runs to the full width, so it holds front wheels up to 0.01 m beside the bar. The planner uses it
      # instead of the rectangle.
      robot_outline: [0.60, 0.14, 0.53, 0.235, -0.12, 0.235, -0.12, -0.235, 0.53, -0.235, 0.60, -0.14]
      # Cutting width of the big deck: its radius 0.1225 m plus the blades, which stand at most 0.018 m over it, both
      # sides (measured by the user, 05.11.); the label allows 0.30 m.
      mower_width: 0.281
      # The centre of the blade 0.23 m ahead of the axle (measured by the user), none to the side.
      blade_ahead: 0.23
      blade_offset: 0.0
      # The GPS antenna 0.10 m ahead of the axle: a first value, measured on the device in phase 7.
      antenna_x: 0.10
      antenna_y: 0.0
      # 0.395 m between the middles of the drive wheels (the MCU computes with 0.40 m); the calibration drive measures
      # the one that acts.
      track: 0.395
      # Only this file sets these: the radius of the wheels, and the charging contacts 0.10 m behind base_link (the Tron
      # backs onto its station).
      wheel_radius: 0.1125
      dock_contact_x: -0.10
      # The Tron reports wheel speed, not ticks: 1000 per m is its scale (mm), the calibration drive measures the true
      # one. The IMU as mounted (rad, gravity read on level ground: roll atan2(ay, az), pitch atan2(-ax, hypot(ay,
      # az))), level until measured; robot.geometry allows 0.087 rad (5 degrees) around these.
      ticks_per_m: 1000.0
      imu_roll: 0.0
      imu_pitch: 0.0
