# The steps of the setup program of the NX60i (mowbite_setup, setup.*), in the order the app shows them. A step is one
# of the checks of x-setup in the interface; params stay within the bounds given there. catalog goes up with every
# change of the steps or of an image.
catalog: 9
# inputs_assign, blade and summary restart the OS: the launch ends and whatever runs it starts it again.
restart: self
steps:
  - id: platform
    stage: device
    check: platform
    symbol: board
  - id: variant
    stage: device
    check: choice
    params: {name: variant, values: [standard, other]}
    value_texts:
      standard:
        de: {name: Verkabelt nach Standard}
        en: {name: Wired as standard}
      other:
        de: {name: Anders verkabelt}
        en: {name: Wired another way}
    texts:
      de:
        name: Verkabelung
        help: >-
          Sind STOP-Tasten, Hebesensoren und Stoßfänger so an die Platine angeschlossen wie in der Anleitung des
          Umbaus?
        fix: Im Zweifel Standard wählen. Die Prüfung der Eingänge zeigt, ob jeder Sensor ankommt.
      en:
        name: Wiring
        help: Are the STOP buttons, lift sensors and bumper connected to the board as the guide of the conversion says?
        fix: When in doubt pick standard. The check of the inputs shows whether every sensor arrives.
  - id: board
    stage: device
    check: board
    params: {time: 5}
    image: mower.svg
    symbol: board
  # The delays are those of the table in nx60i.yaml of the driver: a lift sensor stops after 2.5 s, the bumper after
  # 0.5 s.
  - id: inputs_assign
    stage: inputs
    check: inputs_assign
    params: {node: xcore_driver}
    parts:
      - id: stop_top
        role: stop
        delay_ms: 10
        texts:
          de: {name: STOP oben}
          en: {name: STOP on top}
      - id: stop_rear
        role: stop
        delay_ms: 10
        texts:
          de: {name: STOP hinten}
          en: {name: STOP at the rear}
      - id: lift_left
        role: lift
        delay_ms: 2500
        texts:
          de:
            name: Hebesensor links
            help: Nur die linke Seite anheben, bis der Vorschlag kommt, dann absetzen.
          en:
            name: Lift sensor left
            help: Lift the left side alone until the proposal comes, then put it down.
      - id: lift_right
        role: lift
        delay_ms: 2500
        texts:
          de:
            name: Hebesensor rechts
            help: Nur die rechte Seite anheben, bis der Vorschlag kommt, dann absetzen.
          en:
            name: Lift sensor right
            help: Lift the right side alone until the proposal comes, then put it down.
      - id: bumper_left
        role: bumper_left
        delay_ms: 500
        texts:
          de:
            name: Stoßfänger links
            help: Den Stoßfänger nur links eindrücken, bis der Vorschlag kommt, dann loslassen.
          en:
            name: Bumper left
            help: Press the bumper in on the left alone until the proposal comes, then let go.
      - id: bumper_right
        role: bumper_right
        delay_ms: 500
        texts:
          de:
            name: Stoßfänger rechts
            help: Den Stoßfänger nur rechts eindrücken, bis der Vorschlag kommt, dann loslassen.
          en:
            name: Bumper right
            help: Press the bumper in on the right alone until the proposal comes, then let go.
    symbol: board
    note:
      de: >-
        Bei Verkabelung nach Standard kann dieser Schritt übersprungen werden. Nach der Zuordnung bleibt der Mäher im
        Notaus, bis er in der App aufgehoben wird.
      en: >-
        Wired as standard, this step can be skipped. After it the mower stays in emergency stop until it is released
        in the app.
  - id: stop
    stage: inputs
    check: input
    params: {role: stop}
    parts:
      - id: top
        texts:
          de: {name: STOP oben}
          en: {name: STOP on top}
      - id: rear
        texts:
          de: {name: STOP hinten}
          en: {name: STOP at the rear}
    image: mower.svg
    accent: stop-accent.svg
    symbol: stop
    note:
      de: Nach dem Loslassen hebt der Mäher den Notaus dieser Prüfung selbst auf. Dann die nächste Taste drücken.
      en: After the button is let go the mower releases the emergency stop of this check itself. Then press the next.
  # The board stops 2.5 s after a lift sensor switches, so a bump of 1.5 s must not stop.
  - id: lift
    stage: inputs
    check: input
    params: {role: lift, within: 3.5, short_max: 1.5, time: 90}
    parts:
      - id: left
        texts:
          de: {name: Links anheben und halten}
          en: {name: Lift the left side and hold}
      - id: right
        texts:
          de: {name: Rechts anheben und halten}
          en: {name: Lift the right side and hold}
      - id: short
        mode: short
        texts:
          de: {name: Kurz anheben und sofort absetzen}
          en: {name: Lift briefly and put down at once}
    image: lift.svg
    accent: lift-accent.svg
    symbol: lift
    note:
      de: Der Notaus kommt erst nach gut zwei Sekunden. Nach dem Absetzen hebt der Mäher ihn selbst wieder auf.
      en: The emergency stop comes only after a good two seconds. Put down again, the mower releases it itself.
  - id: bumper
    stage: inputs
    check: input
    params: {role: bumper, within: 1.5}
    parts:
      - id: left
        role: bumper_left
      - id: right
        role: bumper_right
    image: bumper.svg
    accent: bumper-accent.svg
    symbol: bumper
  - id: imu
    stage: inputs
    check: imu
    parts: [front_up, left_up, turn_left, tilt_stop]
    image: imu.svg
  - id: ntrip
    stage: position
    check: done_when
    params: {condition: ntrip}
    symbol: antenna
  - id: fix
    stage: position
    check: position
    params: {rate: 2}
    symbol: antenna
  # With the mower jacked up, the inputs checked standing: the wheels, then how they stop. stop_max of silence:
  # the board stops 1.0 s after it last heard of the host, so the silence gets more.
  - id: wheels
    stage: wheels
    check: wheels
    confirm: [raised, hand_at_stop]
    symbol: wheels
    mark: [wheel_left, wheel_right]
  - id: stop_moving
    stage: wheels
    check: stop_moving
    parts:
      - id: stop
        role: stop
      - id: bumper_left
        role: bumper_left
      - id: bumper_right
        role: bumper_right
    confirm: [raised, hand_at_stop]
    symbol: stop
  - id: no_command
    stage: wheels
    check: no_command
    confirm: [raised, hand_at_stop]
    symbol: wheels
  - id: silence
    stage: wheels
    check: silence
    params: {stop_max: 1.5, rounds: 5, spread_max: 0.3, emergency: [HIGH_LEVEL, TIMEOUT_HIGH_LEVEL]}
    confirm: [raised, hand_at_stop]
    symbol: board
  - id: driver_end
    stage: wheels
    check: driver_end
    params: {emergency: [HIGH_LEVEL, TIMEOUT_HIGH_LEVEL]}
    confirm: [raised, hand_at_stop]
    symbol: board
  # On the ground, 3 m clear: about 2 m straight on and silent, a turn, back until STOP, against a soft obstacle with
  # the bumper at the rear. The bounds of standing are those of M8.
  - id: ground
    stage: ground
    check: ground
    params: {quiet_max: 1.0, quiet_way: 0.6, stop_max: 0.5, stop_way: 0.3, bumper_direction: backward}
    confirm: [area_clear]
    symbol: ground
  # The disc taken off, a hand at STOP. Unmeasured on the NX60i: the bounds follow the firmware (the blade follows a
  # setpoint after 0.5 s and slows by about 2000 rpm/s from 2800, the board stops 1.0 s after it last heard of the host
  # and 2.5 s after a lift sensor switches); its first run measures.
  - id: blade
    stage: blade
    check: blade
    params:
      node: xcore_driver
      percent: 100
      rpm: 2000
      spin_up: 3
      off_max: 2.5
      lease: 1.0
      lease_extra: 2.5
      silent_max: 3.5
      stop_max: 5.0
      emergency: [HIGH_LEVEL, TIMEOUT_HIGH_LEVEL]
    confirm: [blade_removed, hand_at_stop]
    symbol: blade
  # Once every safety step passed: the date and the stand time without the host for xcore_driver, then a restart.
  - id: summary
    stage: safety
    check: summary
    params: {node: xcore_driver}
    confirm: [seen_myself]
  - id: dimensions
    stage: dimensions
    check: geometry
    params:
      keys: [robot_width, robot_front, robot_rear, mower_width, blade_ahead, blade_offset, antenna_x, antenna_y, track]
  # What this mower took over from the Tron ("Of the Tron" in platform.yaml) and the assumptions of geometry.yaml: the
  # summary waits until the user says they are measured on this mower.
  - id: tron_values
    stage: dimensions
    check: choice
    params: {name: tron_values, values: [measured]}
    skippable: false
    value_texts:
      measured:
        de: {name: An diesem Mäher gemessen}
        en: {name: Measured on this mower}
    texts:
      de:
        name: Werte der Tron
        help: >-
          Einige Werte hat dieser Mäher von der Tron übernommen und nie selbst gemessen: Kippgrenze, Rampen und
          Bremswerte, Werte des Pfadfolgers, des Andockens und der Lokalisierung, dazu Radradius, Radbreite und die
          Lage der Ladekontakte. Erst wenn sie an diesem Mäher gemessen sind, gibt die Zusammenfassung die Sicherheit
          frei.
        fix: Die gemessenen Werte in die Datei dieses Mähers eintragen (nx60i.yaml im Datenordner), dann bestätigen.
      en:
        name: Values of the Tron
        help: >-
          This mower took some values over from the Tron and never had them measured: the tilt limit, ramps and
          braking, values of the path follower, of docking and of the localization, and the wheel radius, the width
          of the wheels and where the charging contacts sit. Only once they are measured on this mower does the
          summary release the safety.
        fix: Put the measured values into the file of this mower (nx60i.yaml in the data folder), then confirm.
  - id: station
    stage: station
    check: done_when
    params: {condition: station}
    symbol: dock
  - id: area
    stage: map
    check: done_when
    params: {condition: area}
    symbol: map
  - id: dock_test
    stage: trial
    check: done_when
    params: {condition: dock_test}
    symbol: dock
  - id: mow
    stage: trial
    check: done_when
    params: {condition: mow}
    symbol: blade
