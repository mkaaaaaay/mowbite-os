# Parameters of the xCore driver on the YardForce NX60i (OpenMower v2 carrier, xCore with three motor controllers).
# Values from the configuration that ran on this mower (params of OpenMower, read 02.11.); marked ones are checked
# with the wheels in the air.
xcore_driver:
  ros__parameters:
    platform: yardforce_nx60i
    # The board sits on eth0 of the CM4 (172.16.78.1/24, board by DHCP); its announcements come as multicast there.
    interface: eth0
    bind_ip: 172.16.78.1
    # Name of the carrier the board starts its services for.
    robot_firmware: YardForce
    expected_major_version: 1

    ticks_per_meter: 2025.0
    wheel_distance: 0.3556
    # From the firmware: the right counter falls going forward. Checked in the air.
    left_ticks_sign: 1
    right_ticks_sign: -1
    # Speed model of the wheels, measured in the air at duties 0.02 to 0.1 (firmware v1.4.0-47): they stand at duty
    # 0.02 and turn at about 0.58 x (duty - 0.019) m/s above (right about 5 % slower). A wheel speed v gets duty v / duty_slope + duty_deadband;
    # a duty above max_duty shortens both wheels by the same factor. With max_duty 0.3 a wheel reaches 0.163 m/s, and
    # max_linear_speed and max_angular_speed in hw/capabilities are lowered to that. M8 measures both on the ground.
    duty_slope: 0.58
    duty_deadband: 0.019
    max_duty: 0.3
    regulator_feedback: false
    max_linear_speed: 0.3
    max_angular_speed: 0.3
    cmd_vel_timeout: 0.5

    allow_blade: false
    blade_speed_percent: 100
    blade_lease_max: 2.0
    blade_stop_time: 5.0
    blade_still_rpm: 100.0

    # Standard of the YardForce carrier: the sensor lies upside down.
    imu_axis_remap: [1, -2, -3]
    imu_frame_id: base_link

    # 7S pack. The board switches the CM4 off below 21.0 V after about 11 s. battery_empty_voltage, _full_ and
    # _critical_ come from the logic (platform.yaml of the platform), handed over by its platform.py and
    # measure.launch.py.
    battery_critical_high_voltage: 29.9
    charge_voltage: 29.4
    # No termination current: OpenMower never sent one (its key was not read), the charger chip keeps its own.
    # The station delivers this charge voltage or more while the mower stands on its contacts.
    dock_voltage: 5.0

    # Exactly what the mower always had: another value restarts the board.
    gps_uart: 6
    gps_baudrate: 460800
    gps_protocol: nmea
    # The board evaluates the receiver itself; this driver passes its solutions on as gps/absolute_pose and RTCM from
    # gnss/rtcm to it. datum_lat, datum_long and datum_height of the garden go into the parameter file on the mower,
    # not here; without them no pose is published.
    gnss_source: xcore_driver
    # The board tells no age of its corrections: RTK fixed counts only while this driver passed RTCM within this many s.
    max_correction_age: 30.0

    # One entry per GPIO input, in this order on the board; "none" for no emergency reason or role.
    inputs:
      gpio_lines: [GPIO1, GPIO5, GPIO10, GPIO11, GPIO12, GPIO13]
      gpio_active_high: [true, true, true, true, true, true]
      gpio_reasons: [stop, stop, lift, lift, collision, collision]
      gpio_delays_ms: [10, 10, 2500, 2500, 500, 500]
      # Top stop, rear stop, lift front left and right, bumper rear right and left.
      gpio_roles: [stop, stop, lift, lift, bumper_right, bumper_left]
      cover: [hall_mux=om]
      # The lines a sensor can be on at this board. Started with learn the driver watches these instead of the table
      # above and nothing moves: the setup program finds the line of every sensor that way.
      candidates: [GPIO1, GPIO5, GPIO6, GPIO8, GPIO9, GPIO10, GPIO11, GPIO12, GPIO13]
      learn: false

    # Checks of the driver itself, assumptions until the safety measurement. Tilt from gravity in the IMU: above
    # tilt_limit deg for tilt_time s latches TILT, a release needs a fresh sample below tilt_release deg.
    tilt_limit: 40.0
    tilt_time: 0.5
    tilt_release: 26.0
    imu_fresh: 0.5
    # Up to uncommanded_window s after the last drive setpoint other than 0: a wheel faster than uncommanded_speed
    # for uncommanded_time s, uncommanded_after s or more after that setpoint, latches; so does a wheel faster than
    # overspeed_factor x (max_linear_speed + max_angular_speed x wheel_distance / 2) for overspeed_time s.
    uncommanded_speed: 0.1
    uncommanded_after: 1.0
    uncommanded_window: 5.0
    uncommanded_time: 0.2
    overspeed_factor: 1.3
    overspeed_time: 0.5
    # A gap this long in the driver's own I/O thread counts as a lost link (the board stops after 1.0 s).
    io_stall: 0.8
    # A running service lost this often within contest_window s at the same endpoint means another host claims it.
    contest_losses: 2
    contest_window: 10.0

    # Set after the safety measurement of this mower: the time the board keeps the last setpoint without the host in
    # s (-1 unknown), and the date. Without the date only remote control.
    failsafe_without_host: -1.0
    safety_measurement_date: ""
