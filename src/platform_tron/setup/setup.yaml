# The steps of the setup program of the Tron (mowbite_setup, setup.*), in the order the app shows them. A step is one
# of the checks of x-setup in the interface; params stay within the bounds given there. catalog goes up with every
# change of the steps or of an image. mark names parts of robot_shape (geometry.yaml).
catalog: 10
# hardware, blade and summary restart the OS: mowbite-host restarts the service (host.restart_os).
restart: host
steps:
  - id: platform
    stage: device
    check: platform
    symbol: board
  - id: hardware
    stage: device
    check: hardware
    texts:
      de:
        name: Hardware einschalten
        help: >-
          Nach der Installation spricht MowBite OS die Platine der Tron noch nicht an. Mit einem Tipp schaltet es die
          Treiber für Platine, GPS und Lagesensor ein und startet dafür kurz neu. Dabei bewegt sich nichts.
        fix: >-
          Kommt der Haken nach dem Neustart nicht: die Tron mit der Taste aus- und wieder einschalten und den Schritt
          wiederholen. Bleibt er weiter aus, passt die Firmware der Platine vielleicht nicht zu MowBite OS.
      en:
        name: Turn on the hardware
        help: >-
          Right after the installation MowBite OS does not talk to the board of the Tron yet. One tap turns on the
          drivers for the board, the GPS and the motion sensor; the system restarts briefly for it. Nothing moves
          meanwhile.
        fix: >-
          If the check mark does not come after the restart: switch the Tron off and on with its button and repeat
          the step. If it still does not come, the firmware of the board may not fit MowBite OS.
    symbol: board
  - id: board
    stage: device
    check: board
    params: {time: 5}
    image: mower.svg
    symbol: board
  - id: stop
    stage: inputs
    check: input
    params: {role: stop, time: 90}
    parts:
      - id: top
    image: mower.svg
    accent: stop-accent.svg
    symbol: stop
    mark: [stop_top]
    # The board holds stop until the release, so the step ends only with it.
    note:
      de: Nach dem Loslassen hebt der Mäher den Notaus dieser Prüfung selbst auf.
      en: After the button is let go the mower releases the emergency stop of this check itself.
  - id: lift
    stage: inputs
    check: input
    params: {role: lift, within: 3, time: 90}
    parts:
      - id: front
        texts:
          de: {name: Vorn an der Haube anheben und halten}
          en: {name: Lift the front by the hood and hold}
    image: lift.svg
    accent: lift-accent.svg
    symbol: lift
    note:
      de: >-
        Die Sensoren sitzen vorn unter der Haube, wenige Zentimeter reichen. Nach dem Absetzen hebt der Mäher den
        Notaus selbst wieder auf.
      en: >-
        The sensors sit at the front under the hood, a few centimetres are enough. Put down again, the mower releases
        the emergency stop itself.
  - id: bumper
    stage: inputs
    check: input
    params: {role: bumper, within: 1.5}
    parts:
      - id: left
        role: bumper_left
      - id: right
        role: bumper_right
    image: bumper.svg
    accent: bumper-accent.svg
    symbol: bumper
    mark: [bumper_left, bumper_right]
  - id: imu
    stage: inputs
    check: imu
    parts: [front_up, left_up, turn_left, tilt_stop]
    image: imu.svg
  - id: correction
    stage: position
    check: choice
    params: {name: correction, values: [ntrip, radio]}
    value_texts:
      ntrip:
        de: {name: Korrekturdienst über das Netz (NTRIP)}
        en: {name: Correction service over the network (NTRIP)}
      radio:
        de: {name: Eigene Station per Funk am Empfänger}
        en: {name: Own station by radio at the receiver}
    texts:
      de:
        name: Korrekturquelle
        help: Woher bekommt der Mäher die Korrekturdaten für die genaue Position?
        fix: Mit einem Dienst wie SAPOS oder einer eigenen Station im Heimnetz NTRIP wählen.
      en:
        name: Source of corrections
        help: Where does the mower get the correction data for its exact position from?
        fix: Pick NTRIP for a service or for a station of your own in the home network.
    symbol: antenna
  - id: ntrip
    stage: position
    check: done_when
    params: {condition: ntrip}
    symbol: antenna
    note:
      de: Mit einer eigenen Station per Funk diesen Schritt überspringen.
      en: Skip this step with a station of your own by radio.
  - id: fix
    stage: position
    check: position
    symbol: antenna
  # With the mower jacked up, the inputs checked standing: the wheels, then how they stop. stop_max of silence:
  # the board of the Tron stops 0.15 to 0.28 s after the last setpoint.
  - id: wheels
    stage: wheels
    check: wheels
    confirm: [raised, hand_at_stop]
    symbol: wheels
    mark: [wheel_left, wheel_right]
    # Lifted off a jack the Tron latches lift at a few degrees already (tron-geraet, T7.2).
    note:
      de: Die Tron auf einen Bock unter dem Gehäuse stellen, Räder frei, vorn nicht höher als hinten. Meldet sie
        Anheben, anders aufbocken.
      en: Put the Tron on a stand under its body, wheels free, the front no higher than the rear. If it reports
        lifting, put it up another way.
  - id: stop_moving
    stage: wheels
    check: stop_moving
    parts:
      - id: stop
        role: stop
      - id: bumper_left
        role: bumper_left
      - id: bumper_right
        role: bumper_right
    confirm: [raised, hand_at_stop]
    symbol: stop
  - id: no_command
    stage: wheels
    check: no_command
    confirm: [raised, hand_at_stop]
    symbol: wheels
  - id: silence
    stage: wheels
    check: silence
    params: {stop_max: 1.0, rounds: 5, spread_max: 0.3, emergency: [HIGH_LEVEL]}
    confirm: [raised, hand_at_stop]
    symbol: board
  - id: driver_end
    stage: wheels
    check: driver_end
    params: {emergency: [HIGH_LEVEL]}
    confirm: [raised, hand_at_stop]
    symbol: board
  # On the ground, 3 m clear: about 2 m straight on and silent, a turn, back until STOP, against a soft obstacle.
  # The bounds of standing are those of the NX60i (M8): the Tron is unmeasured on the ground, its first run measures.
  - id: ground
    stage: ground
    check: ground
    params: {quiet_max: 1.0, quiet_way: 0.6, stop_max: 0.5, stop_way: 0.3, bumper_direction: forward}
    confirm: [area_clear]
    symbol: ground
  # The disc taken off, a hand at STOP. Bounds as measured on the Tron: one stage 100 % (30 and 100 % both turn about
  # 3000 rpm), 2500 rpm within 3 s; off, STOP, bumper, lifting and without host stand within 1.0 s (measured 0.2 to
  # 0.6 s), without renewal within the lease and 1.0 s (measured 1.4 s after the last renewal).
  - id: blade
    stage: blade
    check: blade
    params:
      node: tron_mcu
      percent: 100
      height: 90
      rpm: 2500
      spin_up: 3
      off_max: 1.0
      lease: 1.0
      lease_extra: 1.0
      silent_max: 1.0
      stop_max: 1.0
      emergency: [HIGH_LEVEL]
    confirm: [blade_removed, hand_at_stop]
    symbol: blade
  # Once every safety step passed: the date and the stand time without the host for tron_mcu, then a restart.
  - id: summary
    stage: safety
    check: summary
    params: {node: tron_mcu}
    confirm: [seen_myself]
  - id: dimensions
    stage: dimensions
    check: geometry
    params:
      keys: [robot_width, robot_front, robot_rear, mower_width, blade_ahead, blade_offset, antenna_x, antenna_y, track]
    mark: [outline]
  - id: station
    stage: station
    check: done_when
    params: {condition: station}
    symbol: dock
  - id: area
    stage: map
    check: done_when
    params: {condition: area}
    symbol: map
  - id: calibration
    stage: calibration
    check: done_when
    params: {condition: calibration}
    symbol: ground
  - id: dock_test
    stage: trial
    check: done_when
    params: {condition: dock_test}
    symbol: dock
  - id: mow
    stage: trial
    check: done_when
    params: {condition: mow}
    symbol: blade
