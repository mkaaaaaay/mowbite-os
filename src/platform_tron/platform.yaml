# The Airseekers Tron: its values on top of stack.yaml, which has the meaning of each, and the parameters of its own
# nodes. Values marked as assumption are checked in phase 6.

/**:
  ros__parameters:
    journal_platform: tron
    # Start, home and on held this long give HELD (tron_buttons), hw/capabilities reports it (tron_mcu); the vendor
    # also took 3 s.
    button_hold_s: 3.0
    # The vendor's NPU runtime, model and class list for tron_vision and the obstacles of tron_stereo, copied by hand
    # from its update; never in repo, bundle or image.
    library_path: /userdata/mowbite-vision/librknnrt.so
    model_path: /userdata/mowbite-vision/model.rknn
    labels_path: /userdata/mowbite-vision/labels.txt
    journal_libraries: [tron_]
    journal_max_mb: 2048.0
    journal_max_days: 14.0
    journal_reserve_mb: 1024.0
    incidents_max_mb: 512.0
    incidents_max_days: 30.0
    incidents_max_days_safety: 90.0
    # The dock marker of the rear camera (M3b 13.11.: seen by the camera from 0.1 to 0.8 m and carried to the docked
    # pose); the blind distance is estimated (M3c); every image up to 1.2 m (measured 14.11. in a dark room with the
    # station lit).
    dock_marker: [-0.160, 0.0, 0.0]
    marker_blind_distance: 0.07
    marker_range: 1.2
    dock_overshoot: 0.05
    contact_timeout: 10.0
    # Assumption until phase 7.
    dock_max_position_accuracy: 0.03
    # The direction of the marker errs 3 to 5 degrees (M3b); at the contacts the limit stays near the one above.
    dock_accuracy_per_m: 0.09
tron_mcu:
  ros__parameters:
    port: /dev/ttyS9
    send_imu: true
    # Without host the MCU keeps the last setpoint ~3.6 s, but ends it ~0.23 s after a heartbeat that comes alone after
    # it (T9, 2026-11-19): a heartbeat goes heartbeat_after_speed s after each SpeedData, all frames of a tick in one
    # write, as measured. The driver sends motion at most every 100 ms, every start sends the stop.
    speed_heartbeat: later
    # After cmd_vel_timeout s without hw/cmd_vel come three stops. speed_repeat_window > 0 repeats the last setpoint
    # every 100 ms for that long instead, stops at its end and needs a measurement on the Tron first.
    cmd_vel_timeout: 0.5
    speed_repeat_window: 0.0
    telemetry_timeout: 1.0
    allow_blade: false
    # Defaults for blade requests that leave speed or height at 0. The speed changes nothing on firmware 0.6.36: the
    # motor turned at about 3000 rpm at 30 and at 100 % (measured 2026-11-11; below 30 and above 100 not measured).
    blade_speed_percent: 100
    mow_height_mm: 60
    # Height in the off frames, as the maker's software sends it.
    blade_off_height_mm: 90
    # Longest blade lease in s; without a renewal the blade goes off when it runs out.
    blade_lease_max: 2.0
    bumper_latches_emergency: true
    # The MCU tells tilt only from the forwarded IMU: without a sample for imu_timeout s motion and blade are blocked
    # (G1, G10). The first sample may take imu_start_timeout s after the start (the IMU runs in another process, G25),
    # blocked as well but without an emergency. An off frame is not confirmed: a blade still at blade_still_rpm or more
    # blade_stop_time s after it went off blocks as well and is sent off again (G23). The IMU times are assumptions
    # until measured on the Tron. With the disc on, the blade stood within 0.6 s of every off, STOP, bumper, lift and
    # lost host (measured 2026-11-14).
    imu_timeout: 0.5
    imu_start_timeout: 2.0
    blade_stop_time: 1.5
    blade_still_rpm: 100
    # Nor is a stop: a wheel still at wheel_still_speed m/s or more wheel_stop_time s after the stop frames latches
    # MOWER_NOT_STOPPED and the stops go out again. The standing Tron reports up to 0.011 m/s and 0.028 rad/s, ~0.017
    # m/s at the faster wheel (07./08.11.); the slowest setpoint seen kept running was 0.03 m/s (18.11.).
    wheel_stop_time: 1.5
    wheel_still_speed: 0.025
    # STOP at the mower releases the emergency (G37): free 2 s, then a short press (0.1 to 2 s). The driver reports it
    # on hw/button, the logic releases as for emergency.reset. The MCU keeps stop until a clear frame (measured
    # 2026-11-15), so the gesture works only with stop_clear_period > 0: STOP cleared every stop_clear_period s during
    # the emergency, from stop_clear_delay s after the latch on; a held STOP stays shown. The MCU no longer locks itself
    # then: before the first such clear the driver writes data_dir/stop-clear-mark, and a start with it latches. Measured
    # on the Tron 2026-11-24 (G37 stage B).
    stop_release: true
    stop_clear_period: 0.25
    stop_clear_delay: 1.5
    # Longest hw/silence of the setup program in s (0 offers none), taken only during a setup step. Without host the
    # MCU stopped the blade within 0.6 s (14.11.), the wheels only in some runs (above), and in 20 s it latched nothing
    # by itself (15.11.).
    silence_max: 3.0
    # Longest hw/silence after a setpoint as the last frame (FP55, M6): the MCU kept it 3.58 to 3.61 s (T9).
    silence_last_setpoint_max: 5.0
    # Firmware of the cutter and chassis boards the driver was measured with (since 07.11., vendor stand 1.3.32).
    # Firmware outside a list blocks motion and blade (FIRMWARE_INCOMPATIBLE); add one only after the measurements.
    # Newer firmware an owner measured on this device drives as well: measured_firmware in tron.setup.yaml, entries
    # "<cutter>/<chassis>/<sha256 of the content of device_id_file>", read at the start.
    cutter_firmware: ["0.6.36"]
    chassis_firmware: ["0.6.34"]
    device_id_file: ""
    # Set after the safety measurement in phase 6 (hw/capabilities): the time the MCU keeps the last setpoint without
    # a heartbeat in s (-1 unknown), and the date of the measurement. Without the date only remote control.
    failsafe_without_host: -1.0
    safety_measurement_date: ""
    # The highest obstacle_mode the camera is proven for on the Tron (hw/capabilities): 1 shows obstacles only; 2 lets
    # the mower stop for them, after reach and delay per class were measured on the mower (FP30, G44).
    obstacle_mode_max: 1
    # The obstacle sensors (hw/capabilities): the stereo camera by its camera_id of tron_stereo.
    obstacle_sources: ["stereo"]

tron_gnss:
  ros__parameters:
    port: /dev/ttyS4
    # Assumption from the reference documentation, checked on the device.
    baud: 115200
    # max_correction_age: under /** of stack.yaml.
    # RTK board in front of the UM960: $GNRTK,ON every board_keepalive s while RTCM came within board_active_window s,
    # RTKRESET when it falls back from ON on its own. RTCM goes to the port only while it reports ON (board_gate).
    board_keepalive: 4.0
    board_active_window: 10.0
    board_reset_on_off: true
    board_gate: true
    # The motion vector comes from the RTK fixed positions, not from the course of the board, which holds it fixed
    # (motion_from_fixes and its limits in tron_gnss/gnss_tracker.h).
    # With data_dir/ntrip.yaml (the start sets data_dir) RTK fixed counts as float until the first NTRIP
    # corrections went to the receiver: before that a LoRa base with a reference of its own may give the fix (G24).
    # The datum of the garden comes only from MOWBITE_DATUM_* in /etc/mowbite/os.conf: the start overrides files.

tron_imu:
  ros__parameters:
    port: /dev/ttyS1
    baud: 115200
    # The sensor sits upright (measured 07.11.). Gravity up at rest stops imu/data, see tron_imu.
    mount_roll_deg: 0.0

mowbite_localization:
  ros__parameters:
    # Assumptions for the Tron until phase 5.
    gyro_still_spread: 0.02
    gyro_offset_limit: 0.02
    # The standing Tron reports up to 0.011 m/s and 0.028 rad/s, a wheel moves from ~0.06 m/s (measured 07./08.11.).
    min_speed: 0.04
    # Assumptions until measured in phase 7; in 7 turns on wet lawn the Tron moved 0.46 to 0.70 of half the track
    # times what the gyro turned less than the wheels (16.11.).
    accuracy_growth_per_m: 0.05
    accuracy_growth_per_s: 0.01
    # Assumptions until phases 6 and 7.
    odometry_noise: 0.03
    gyro_noise: 0.005

mowbite_logic:
  ros__parameters:
    # The kernel record of the rootfs (mowbite-crash).
    crash_record: /run/mowbite/crash
    # 6S Li-ion. empty is an assumption, 3.5 V per cell, until the discharge curve is measured.
    battery_empty_voltage: 21.0
    battery_full_voltage: 25.2
    dock_charge_voltage: 28.0
    # The charging contacts lie 0.10 m behind base_link: the Tron backs onto the docking station and faces away from
    # it there. Assumption until phase 7.
    dock_reference_limit: 0.10
    # Straight ahead out of the station: the wheels climb out of its 10 mm hollows, a crawl would stay in them.
    # undock_distance is the 0.8 m of the vendor. Assumptions until phase 7.
    undock_distance: 0.8
    undock_speed: 0.15
    # Backwards onto the station. Assumptions until phase 7.
    docking_approach_distance: 0.8
    docking_speed: 0.1
    contact_speed: 0.06
    dock_gate_distance: 0.25
    dock_gate_lateral: 0.02
    dock_gate_heading: 8.0
    # require until docking by RTK is measured on the Tron (P7).
    dock_guide: require
    # The Tron charges with 3.3 to 4.2 A and draws 0.6 A standing; tron_mcu sends Charge 1 with the debounced
    # contact. Assumptions until phase 7.
    charge_confirm_current: 0.5
    charge_confirm_timeout: 20.0
    charge_expected_below: 95.0
    # The blade turns only with allow_blade of tron_mcu as well; its rpm for the spin-up is not measured yet.
    blade_running_rpm: 100
    # ASSUMPTION until the discharge curve and question 47 (iv): 3.28 V per cell, 2 s against dips under load
    # (battery_critical_time); battery_hot_temperature stays 0 until question 47 (ii).
    battery_critical_voltage: 19.7

mowbite_calibration:
  ros__parameters:
    # At 0.3 (0.06 m/s per wheel, where they stick) the Tron turned in jerks between 0.04 and 0.46 rad/s; from 0.41 to
    # 0.67 the wheels slipped by a third on wet lawn (16.11.). 0.4 is 0.08 m/s per wheel, the least the vendor turns
    # at.
    spin_rate: 0.4
    line_min_speed: 0.08

mowbite_follower:
  ros__parameters:
    # Up to 0.55 m/s and 0.5 rad/s on the path, speeding up and braking as the vendor firmware, without a braking
    # measurement (the user, 15.11.); braking from 0.55 at 0.8 m/s² takes 0.19 m of the path. On the spot up to 0.45
    # rad/s (the user 16.11.: at 0.7 the wheels slipped more on wet lawn); turn_deceleration is an assumption.
    speed_fast: 0.55
    speed_slow: 0.3
    speed_turn: 0.15
    max_linear: 0.55
    max_angular: 0.5
    spot_max_angular: 0.45
    turn_deceleration: 1.0
    # turn_feedback stays off: on the spot the Tron turned at 0.81 of what its wheels reported and 0.61 of the command
    # (mowing, 15.11.), but fast turns slipped more than slow ones on wet lawn (16.11.).
    # On wet lawn one wheel gripped while the other spun, and the Tron swung up to 0.3 m off (16.11.); the gain is an
    # assumption until measured. Below 0.06 m/s the wheels stick and jerk (13.11.).
    turn_hold_gain: 2.0
    wheel_min_speed: 0.06
    acceleration: 0.5
    deceleration: 0.8
    # 0.25 * 0.44 = 0.11 m/s on arcs of turn_radius.
    turn_rate: 0.25
    # The dead band of the wheels is ~0.05 m/s each (estimated); 0.45 * 0.1975 = 0.089 m/s per wheel (at 0.28 the Tron
    # turned at 0.28 ± 0.16 rad/s, measured 15.11.).
    creep_speed: 0.06
    min_turn_rate: 0.45
    # Below about 0.4 m the inner wheel would run under its dead band at turn_rate (the bulb turns of the planner,
    # 0.13 m). Assumption until phase 6.
    min_arc_radius: 0.3
    # The user 16.11.
    max_turn_slide: 0.15

mowbite_safety:
  ros__parameters:
    # The Tron mows slopes up to 31 degrees (vendor); its MCU reports a lift from about 37. Assumptions until phases 6
    # and 7.
    tilt_limit: 31.0
    tilt_release: 26.0
    # As the vendor firmware smooths (mikey's notes).
    ramp_linear: 0.5
    ramp_angular: 1.0

mowbite_light:
  ros__parameters:
    # output stays none until the lights are released on the mower.
    device: /dev/spidev3.0
    # 55 lit (2 x 14 front, 27 top) of the 60 the chain is driven with.
    leds: 55
    # Seen from the mower: fronts left and right bottom up, the top bar from both ends to the middle.
    strips: ["0-13", "14-27", "28-41", "54-42"]
    buffer_leds: 60
    # 120 of 255, full brightness of the vendor's patterns.
    max_brightness: 0.47
    # Assumptions until measured.
    max_current_ma: 1200.0
    ma_per_channel: 20.0

mowbite_sound:
  ros__parameters:
    # output stays none until the speaker is released on the mower; the mixer stays as asound.state has it.
    device: plughw:0,0
    # The vendor's announcements (en-US), newest version first.
    vendor_dirs:
      - /userdata/RobotData/upgrade/*/src/mower_task/mower_light_sound/sound_files
      - /userdata/RobotData/voice/sound_files
    # Situation=code of the vendor's sound_list.txt; DOCKING_START has none.
    vendor_codes:
      - MOWING_START=900001
      - MOWING_COMPLETE=900102
      - LOW_BATTERY=900105
      - RAIN_DETECTED=400005
      - MOWING_PAUSED=900010
      - AREA_RECORDING_MODE=900002
      - DOCKING_FAILED=900025
      - CHARGING_START=900011
      - CHARGING_DONE=900013
      - EMERGENCY=900017
      - LIFT_TRIGGERED=900018
      - SCHEDULE_START=900006

# tron_vision, the camera AI on a side camera: left with MOWBITE_VISION=on, right with MOWBITE_RIGHT=on as a second
# instance in the namespace /right. These values hold for both.
/**/tron_vision:
  ros__parameters:
    # Inferences per second (0.5 to 5).
    infer_rate: 2.0
    # crop: the middle 3:4 of the frame fills the upright model input; pad: the whole frame with gray bars.
    fit: crop
    # Gray world white balance also for the inference, not only for the shown image.
    white_balance_inference: false
    # Vertical blanking of the sensor in lines; 0 leaves its 30 fps.
    vertical_blanking: 0
    # Pictures on camera/<camera_id>/jpeg, and without the boxes on camera/<camera_id>/jpeg_plain, each only while
    # someone subscribes, at most jpeg_max_rate per second (0.5 to 5) and jpeg_max_kb each; the JPEG quality steps
    # down to keep the size. H.264 likewise on the RTSP paths <camera_id> and <camera_id>_plain of rtsp_port.
    # jpeg_max_rate, jpeg_max_kb, score_threshold, max_rss_mb and crash_dir: the defaults of the node. Left: camera_id
    # oa_left, NPU core 0, rtsp_port 8556 and the sensors vision_*, the defaults of the node too.

# Only what the right instance does otherwise; sensor_name and capture_device follow camera_id.
/right/tron_vision:
  ros__parameters:
    camera_id: oa_right
    npu_core: 1
    rtsp_port: 8557
    # The sensors vision_right_state, vision_right_last and vision_right_rate ("Camera AI right").
    sensor_suffix: _right

# tron_stereo, the live picture of the stereo camera (MOWBITE_STEREO=on): bitrate_kbps, rtsp_port, capture_device,
# stream_name, encoder_library, max_rss_mb (101 MB measured with the model) and crash_dir have the defaults of the
# node. record_max_mb above 0 (at most 300) keeps both eyes of the frames of a stream as gray JPEG under record_dir
# (below /run, in RAM, shared with the recording of tron_rear), one per record_interval_s (0.07: every second frame),
# none older than record_keep_min; only while a viewer holds the stream; off by default, for work on the pictures set
# in <data_dir>/tron.yaml.
# gain_wish_file (below /run; /run/mowbite-os/stereo-gain/wish is where tron-stereo-ae of the root file system
# looks) lets the camera wish for the gain level day, dusk or night by the luma of its frames; off without it.
tron_stereo:
  ros__parameters:
    # The stream also runs while the blade runs or hw/status is missing. The self-test per boot (mower standing, blade
    # off), the pause when hot and the lock after a kernel crash stay. A kernel crash in the camera driver while mowing
    # leaves the blade without the host: the MCU then stops the blade motor by itself within 0.4 s (T6, without disc).
    stream_while_mowing: true
    # Obstacles ahead (hw/obstacles at obstacle_rate 5/s): the camera runs on after its self-test and the model of
    # tron_vision looks at the left eye on NPU core 2. Without calibration_path (both eyes, from the calibration of this
    # Tron) or mount (x, y, z in m and yaw, pitch, roll in rad of the left eye in base_link, measured on this Tron, in
    # <data_dir>/tron.yaml) it reports NOT_SET_UP. obstacle_rate, range_max, score_threshold: the defaults of the node.
    obstacles: true
    camera_id: stereo
    calibration_path: /userdata/mowbite-vision/stereo-calibration.txt
    npu_core: 2
    # Classes of the model by kind; any other class is an object. The classes of best_large_0208.
    kind_person: [person]
    kind_animal: [dog, cat, hedgehog, rabbit]
    kind_ignore: [manhole, dock]

# tron_side, only the live picture of the right side camera (MOWBITE_RIGHT=on, MOWBITE_RIGHT_NODE=side), streaming only
# while a viewer is there:
# sensor_name, capture_device, vertical_blanking, jpeg_max_rate, jpeg_max_kb, max_rss_mb and crash_dir have the defaults
# of the node.

# tron_rear, the dock marker of the rear camera (MOWBITE_REAR=on), on request of the logic. Without lens, mount, marker
# side or pattern it reports NOT_SET_UP and never measures; a measured value for one mower goes to <data_dir>/tron.yaml.
# Beside it the live picture of the camera, only while a viewer is there and needing no calibration; the marker goes
# first: a request takes the camera from the viewer, and a picture never delays a measurement.
# device, eval_rate, max_exposure_ms, first_frame_s, frame_gap_s, jpeg_max_rate, jpeg_max_kb, max_rss_mb and crash_dir:
# the defaults of the node. record_max_mb above 0 (at most 300) keeps the evaluated images with their report under
# record_dir (below /run, in RAM), one per record_interval_s, none older than record_keep_min; off by default, for
# offline checks set in <data_dir>/tron.yaml.
tron_rear:
  ros__parameters:
    # fx, fy, cx, cy (px at 1920x1080), k1, k2, p1, p2, k3 (plumb_bob): the vendor's value for all Trons, until M2.
    lens: [1540.499, 1539.740, 986.294, 520.626, -0.373942, 0.165317, -0.000099, -0.000519, 0.0]
    # x, y, z (m) and yaw, pitch, roll (rad) of the camera in base_link, measured on one Tron: pitch 2.2 deg down,
    # roll 1.0 deg; yaw and y are within about 1 deg and 4 mm.
    mount: [-0.105, 0.0, 0.074, 3.14159, 0.038, 0.017]
    # The marker of the station EC1: side of the black square (m) and its 4 x 4 inner cells (0xB532).
    marker_side: 0.04
    marker_pattern: 46386

mowbite_planner:
  ros__parameters:
    # On 0.44 the inner wheel runs 0.06 m/s at the follower's turn_rate 0.25 rad/s, about its dead band (estimated);
    # where no arc fits the nose swings out about 56 cm. Assumption until driven in phase 6 and 7.
    turn_radius: 0.44
