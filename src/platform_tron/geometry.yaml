# The dimensions of the Tron: the values of robot.geometry, read by mowbite_logic as the parameters geometry.*. What the
# user enters with robot.geometry.set goes to data_dir/geometry.json and counts before these. base_link is the middle of
# the axle of the drive wheels, x points forward and y to the left, everything in m. Every platform has a file like
# this one in its package.
mowbite_logic:
  ros__parameters:
    geometry:
      # As the driver reports it (hw/capabilities, system.info).
      platform: airseekers_tron
      # The body: 0.47 m over the drive wheels, the front 0.60 m ahead of their axle (set by the user), behind it the
      # wheels (radius 0.1125 m) and the charging contacts (0.10 m), rounded to 0.12 m. The planner keeps its margins to
      # the lines by it.
      robot_width: 0.47
      robot_front: 0.60
      robot_rear: 0.12
      # The real contour from above as x0, y0, x1, y1, ... (measured from photos with a rule, 16.11.): the bar in front
      # is straight over y +-0.144 at x 0.603, its tips are at (0.546, +-0.2205), the front wheels reach y +-0.227 at
      # x 0.42. The points lie 4 to 5 mm outside the bar; from the tips to the back the full width. The planner uses
      # it instead of the rectangle.
      robot_outline: [0.605, 0.15, 0.54, 0.235, -0.12, 0.235, -0.12, -0.235, 0.54, -0.235, 0.605, -0.15]
      # dock_footprint (the station from above in base_link of the docked mower, as x0, y0, ...) follows once measured;
      # until then the planner takes its own.
      # Cutting width of the big deck: its radius 0.1225 m plus the blades, which stand at most 0.018 m over it, both
      # sides (measured by the user, 05.11.); the label allows 0.30 m.
      mower_width: 0.281
      # The centre of the blade 0.23 m ahead of the axle (measured by the user), none to the side.
      blade_ahead: 0.23
      blade_offset: 0.0
      # The GPS antenna 0.10 m ahead of the axle: a first value, measured on the device in phase 7.
      antenna_x: 0.10
      antenna_y: 0.0
      # 0.395 m between the middles of the drive wheels (the MCU computes with 0.40 m); the calibration drive measures
      # the one that acts.
      track: 0.395
      # Only this file sets these: the radius of the wheels, the width of their tread (55 mm, measured by the user
      # 31.10.; robot.geometry refuses a body that leaves them out), and the charging contacts 0.10 m behind base_link
      # (the Tron backs onto its station).
      wheel_radius: 0.1125
      wheel_width: 0.055
      dock_contact_x: -0.10
      # The Tron reports wheel speed, not ticks: 1000 per m is its scale (mm), the calibration drive measures the true
      # one. The IMU as mounted (rad, gravity read on level ground: roll atan2(ay, az), pitch atan2(-ax, hypot(ay,
      # az))), level until measured; robot.geometry allows 0.087 rad (5 degrees) around these.
      ticks_per_m: 1000.0
      imu_roll: 0.0
      imu_pitch: 0.0
      # How the Tron looks from above, for the app to draw (measured from photos with a rule, 16.11.; rounded corners
      # and faces without a measure are drawn): the parts in the order to draw them, each a closed line of x, y pairs.
      # Shown only; robot_outline above is the body the mower drives and plans with, and covers every part.
      robot_shape:
        parts: [body, hub_left, hub_right, front_mount_left, front_wheel_left, front_mount_right, front_wheel_right,
          bumper_left, bumper_right, handle_left, handle_right, handle_front, hood_left, hood_right, rear, lid,
          camera_hood, camera, stop_top, keys]
        body:
          kind: body
          points: [0.56, 0.0, 0.56, 0.06, 0.47, 0.1, 0.392, 0.15, 0.376, 0.203, 0.19, 0.222, 0.122, 0.197, 0.108, 0.16,
            0.045, 0.16, 0.045, 0.172, -0.045, 0.172, -0.045, 0.104, -0.06, 0.104, -0.06, 0.0, -0.06, -0.104, -0.045,
            -0.104, -0.045, -0.172, 0.045, -0.172, 0.045, -0.16, 0.108, -0.16, 0.122, -0.197, 0.19, -0.222, 0.376,
            -0.203, 0.392, -0.15, 0.47, -0.1, 0.56, -0.06]
        hub_left:
          kind: wheel
          points: [0.045, 0.23, 0.0435, 0.2335, 0.04, 0.235, -0.04, 0.235, -0.0435, 0.2335, -0.045, 0.23, -0.045,
            0.228, -0.0435, 0.2245, -0.04, 0.223, 0.04, 0.223, 0.0435, 0.2245, 0.045, 0.228]
